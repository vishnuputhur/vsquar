<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vsquar · Transaction Manager</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 100%;
      width: 85%;
      margin: 20px auto;
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0077b6;
      font-size: 1.7em;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 0.85em;
    }
    input, select {
      width: 40%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.85em;
    }
    .output {
      background: #e0f7fa;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85em;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #00b4d8;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.85em;
    }
    button.small-btn {
      width: auto;
      padding: 5px 10px;
      margin: 0 3px;
      display: inline-block;
      font-size: 0.7em;
    }
    button.danger { background: #dc3545; }
    button.warning { background: #f4a261; }
    button.success { background: #2a9d8f; }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.75em;
      overflow-x: auto;
      display: block;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #90e0ef;
    }
    .text-muted {
      color: #666;
      font-size: 0.7em;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      background: #0077b6;
      color: #fff;
      padding: 10px;
      font-size: 0.75em;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .container { width: 90%; padding: 10px; }
      input, select { width: 100%; }
    }
    .role-badge {
      text-align: right;
      font-size: 0.7rem;
      margin-bottom: 10px;
      color: #0077b6;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="role-badge" id="roleBadge"></div>
  <div class="flex-row">
    <h1>Vsquar · Transaction Manager</h1>
  </div>
  
  <div class="flex-row">
    <select id="loanSelect" style="flex:2;"></select>
    <button id="refreshBtn" class="small-btn">⟳ Sync</button>
    <button id="downloadPdfBtn" class="small-btn success">📎 Save PDF</button>
    <button id="moreDetailsBtn" class="small-btn" style="background:#6c757d;">ℹ️ More Details</button>
  </div>
  
  <div id="loanSummary" class="output" style="margin-top:5px;">Select a loan to view details</div>
  
  <div id="adminAddBtn" style="display:none; margin:10px 0;">
    <button id="addPaymentBtn" class="success">➕ Add New Payment</button>
  </div>
  
  <div style="overflow-x: auto;">
    <table id="transactionTable" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Planned Date</th>
          <th>Paid Date</th>
          <th>Amount (₹)</th>
          <th>Remaining (₹)</th>
          <th>Remark</th>
          <th class="action-col">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="noDataMsg" class="text-muted" style="text-align:center; padding:20px;">No loan data found.</div>
  <div class="footer">Vsquar · Equal Partners</div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
    authDomain: "csl-calculations.firebaseapp.com",
    projectId: "csl-calculations",
    storageBucket: "csl-calculations.firebasestorage.app",
    messagingSenderId: "887219643486",
    appId: "1:887219643486:web:0cb001f2c72039a00240cf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "VSQURE";
  const DOC_ID = "appData";

  let customers = [], loans = [], transactions = [], cashCapital = 0;
  let currentRole = "viewer";
  let currentLoanId = null;

  function getRoleFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('role') === 'admin' ? 'admin' : 'viewer';
  }

  async function loadData() {
    try {
      const doc = await db.collection(COLLECTION).doc(DOC_ID).get();
      if(doc.exists) {
        const d = doc.data();
        customers = d.customers || [];
        loans = d.loans || [];
        transactions = d.transactions || [];
        cashCapital = d.cashCapital || 0;
      }
      populateLoanSelect();
      if(currentLoanId) renderTable();
    } catch(e) { console.error(e); }
  }

  function getCustomer(id) { return customers.find(c => c.id == id); }
  function getLoan(id) { return loans.find(l => l.id == id); }

  // Total expected amount for a loan (principal + profit for EMI methods, else just principal)
  function getTotalExpectedForLoan(loan) {
    if(loan.method == 4) { // Weekly EMI
      return (loan.weeklyAmount || 250) * (loan.tenure || 44);
    } else if(loan.method == 3) { // Monthly EMI
      return (loan.emiAmount || 0) * (loan.tenure || 1);
    } else {
      // Interest only / Flexible: total expected is principal amount
      return loan.principalAmount;
    }
  }

  // NEW recomputePrincipal: returns total remaining amount (principal + unpaid profit)
  function recomputePrincipal(loan) {
    const totalExpected = getTotalExpectedForLoan(loan);
    const totalPaid = transactions
      .filter(t => t.loanId == loan.id)
      .reduce((sum, t) => sum + t.amount, 0);
    return Math.max(0, totalExpected - totalPaid);
  }

  // Original principal outstanding (only principal component, used for payment allocation)
  function getPrincipalOutstanding(loan) {
    let remaining = loan.principalAmount;
    transactions.filter(t => t.loanId == loan.id).forEach(t => {
      remaining -= (t.principalPortion || 0);
    });
    return Math.max(0, remaining);
  }

  function generateSchedule(loan) {
    if(!loan) return [];
    const startDate = new Date(loan.startDate);
    let schedule = [];
    if(loan.method == 3) { // Monthly EMI
      for(let i=1; i<=(loan.tenure || 1); i++) {
        let due = new Date(startDate);
        due.setMonth(startDate.getMonth() + i);
        schedule.push({ planned: due.toISOString().slice(0,10), expected: loan.emiAmount });
      }
    } else if(loan.method == 4) { // Weekly EMI
      for(let i=1; i<=(loan.tenure || 44); i++) {
        let due = new Date(startDate);
        due.setDate(startDate.getDate() + (i*7));
        schedule.push({ planned: due.toISOString().slice(0,10), expected: loan.weeklyAmount });
      }
    }
    return schedule;
  }

  // Render table: balance column shows remaining total amount (principal+profit) after each paid row
  function renderTable() {
    const loan = getLoan(currentLoanId);
    if(!loan) {
      document.getElementById('transactionTable').style.display = 'none';
      document.getElementById('noDataMsg').style.display = 'block';
      return;
    }

    document.getElementById('noDataMsg').style.display = 'none';
    document.getElementById('transactionTable').style.display = 'table';
    
    const cust = getCustomer(loan.customerId);
    const totalExpected = getTotalExpectedForLoan(loan);
    let totalPaidSoFar = 0;
    document.getElementById('loanSummary').innerHTML = `
      <strong>${cust ? cust.name : 'Unknown'}</strong> | Loan: ₹${loan.principalAmount} | Total Expected: ₹${totalExpected} | Status: ${loan.status.toUpperCase()}
    `;

    const schedule = generateSchedule(loan);
    const loanTxns = transactions.filter(t => t.loanId == loan.id).sort((a,b) => new Date(a.date) - new Date(b.date));
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if(schedule.length > 0) {
      // For scheduled loans (EMI/Weekly)
      schedule.forEach((sch, idx) => {
        const tr = tbody.insertRow();
        const matched = (idx < loanTxns.length) ? loanTxns[idx] : null;
        
        tr.insertCell(0).innerText = idx + 1;
        tr.insertCell(1).innerText = sch.planned;
        
        if(matched) {
          tr.insertCell(2).innerText = matched.date;
          tr.insertCell(3).innerText = `₹${matched.amount}`;
          totalPaidSoFar += matched.amount;
          const remainingAfter = Math.max(0, totalExpected - totalPaidSoFar);
          tr.insertCell(4).innerText = `₹${remainingAfter.toFixed(2)}`;
          tr.insertCell(5).innerText = matched.remark || "";
        } else {
          tr.insertCell(2).innerText = "—";
          tr.insertCell(3).innerText = "—";
          tr.insertCell(4).innerText = "—";
          tr.insertCell(5).innerText = "";
        }
        
        const actionCell = tr.insertCell(6);
        if(currentRole === 'admin') {
          if(matched) {
            actionCell.innerHTML = `<button class="small-btn danger" onclick="deleteTxn(${matched.id})">🗑</button>`;
          } else {
            actionCell.innerHTML = `<button class="small-btn success" onclick="payPlanned('${sch.planned}', ${sch.expected})">+ Pay</button>`;
          }
        } else {
          actionCell.innerHTML = "";
        }
      });
    } 
    else {
      // Non-scheduled loans: show each transaction with cumulative remaining
      const loanTxnsSorted = [...loanTxns];
      let cumulativePaid = 0;
      loanTxnsSorted.forEach((txn, idx) => {
        const tr = tbody.insertRow();
        cumulativePaid += txn.amount;
        const remainingAfter = Math.max(0, totalExpected - cumulativePaid);
        tr.insertCell(0).innerText = idx + 1;
        tr.insertCell(1).innerText = "—";
        tr.insertCell(2).innerText = txn.date;
        tr.insertCell(3).innerText = `₹${txn.amount}`;
        tr.insertCell(4).innerText = `₹${remainingAfter.toFixed(2)}`;
        tr.insertCell(5).innerText = txn.remark || "";
        const actionCell = tr.insertCell(6);
        if(currentRole === 'admin') {
          actionCell.innerHTML = `<button class="small-btn danger" onclick="deleteTxn(${txn.id})">🗑</button>`;
        } else {
          actionCell.innerHTML = "";
        }
      });
    }

    if(currentRole !== 'admin') {
      const actionHeaders = document.querySelectorAll('.action-col');
      actionHeaders.forEach(el => el.style.display = 'none');
      const rows = tbody.rows;
      for(let i=0; i<rows.length; i++) {
        if(rows[i].cells.length > 6) rows[i].deleteCell(6);
      }
    } else {
      const actionHeaders = document.querySelectorAll('.action-col');
      actionHeaders.forEach(el => el.style.display = 'table-cell');
    }
  }

  function populateLoanSelect() {
    const select = document.getElementById('loanSelect');
    select.innerHTML = '<option value="">-- Choose Loan --</option>';
    loans.forEach(l => {
      const c = getCustomer(l.customerId);
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = `${c ? c.name : 'N/A'} - ₹${l.principalAmount}`;
      if(currentLoanId == l.id) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = (e) => {
      currentLoanId = e.target.value;
      renderTable();
    };
  }

  // Updated processPayment with correct principal outstanding logic (original principal minus principalPortions)
  async function processPayment(loanId, date, amount, remark) {
    const loan = getLoan(loanId);
    if(!loan) return;
    
    // Calculate principal remaining (original principal - sum of principalPortion)
    let principalRemaining = loan.principalAmount;
    transactions.filter(t => t.loanId == loan.id).forEach(t => {
      principalRemaining -= (t.principalPortion || 0);
    });
    principalRemaining = Math.max(0, principalRemaining);
    
    let intPortion = 0, prinPortion = 0;

    // Weekly EMI logic: first reduce principal, excess goes to profit (interest)
    if(loan.method == 4) { 
        if (principalRemaining > 0) {
            if (amount <= principalRemaining) {
                prinPortion = amount;
                intPortion = 0;
            } else {
                prinPortion = principalRemaining;
                intPortion = amount - principalRemaining;
            }
        } else {
            prinPortion = 0;
            intPortion = amount;
        }
    } 
    // Monthly EMI logic
    else if(loan.method == 3) {
      const monthlyRate = loan.interestRate / 100;
      let interestDue = parseFloat((principalRemaining * monthlyRate).toFixed(2));
      intPortion = Math.min(interestDue, amount);
      prinPortion = amount - intPortion;
    } 
    // Other methods (Interest Only / Flexible): all goes to interest/profit
    else {
      intPortion = amount;
      prinPortion = 0;
    }

    // Ensure principal portion doesn't exceed remaining principal
    if(prinPortion > principalRemaining) prinPortion = principalRemaining;
    
    const newTxn = {
      id: Date.now(),
      loanId: loan.id,
      date: date,
      amount: amount,
      interestPortion: intPortion,
      principalPortion: prinPortion,
      remark: remark || "",
      timestamp: new Date().toISOString()
    };

    transactions.push(newTxn);
    cashCapital += amount;
    
    // Update loan status based on total expected amount
    const totalExpected = getTotalExpectedForLoan(loan);
    const totalPaid = transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + t.amount, 0);
    if(totalPaid >= totalExpected) {
        loan.status = 'closed';
    } else {
        loan.status = 'active';
    }
    
    await saveToCloud();
    await loadData();
  }

  // Admin: Pay a planned installment (use today's date as paid date)
  window.payPlanned = async (plannedDate, expectedAmount) => {
    const todayDate = new Date().toISOString().slice(0,10);
    const remark = prompt("Enter remark (optional):", "");
    if(remark !== null) {
      await processPayment(currentLoanId, todayDate, expectedAmount, remark);
    }
  };

  window.deleteTxn = async (id) => {
    if(!confirm("Delete this payment?")) return;
    const idx = transactions.findIndex(t => t.id == id);
    if(idx > -1) {
      cashCapital -= transactions[idx].amount;
      transactions.splice(idx, 1);
      await saveToCloud();
      await loadData();
    }
  };

  async function saveToCloud() {
    await db.collection(COLLECTION).doc(DOC_ID).set({
      customers, loans, transactions, cashCapital, lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  // PDF Export: no rupee symbol, generation date, filename = customer name + date
  document.getElementById('downloadPdfBtn').onclick = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const loan = getLoan(currentLoanId);
    if(!loan) {
      alert("Please select a loan first.");
      return;
    }
    const cust = getCustomer(loan.customerId);
    const customerName = cust ? cust.name : "Vsquar";
    const today = new Date();
    const dateStr = today.toISOString().slice(0,10);
    const fileName = `${customerName}_${dateStr}.pdf`;
    
    doc.setFontSize(18);
    doc.text(`Payment Receipt - ${customerName}`, 14, 20);
    doc.setFontSize(10);
    doc.text(`Loan Amount: ${loan.principalAmount} | Method: ${loan.method === 3 ? 'Monthly EMI' : loan.method === 4 ? 'Weekly EMI' : 'Interest/Flex'}`, 14, 30);
    doc.text(`Generated on: ${today.toLocaleString()}`, 14, 37);
    
    // Gather table data without ₹ symbol
    const rows = [];
    document.querySelectorAll('#tableBody tr').forEach(tr => {
      const rowData = [];
      const cells = tr.querySelectorAll('td');
      for(let i = 0; i < Math.min(cells.length, 6); i++) {
        let cellText = cells[i].innerText;
        cellText = cellText.replace(/₹/g, '').trim();
        rowData.push(cellText);
      }
      while(rowData.length < 6) rowData.push('');
      rows.push(rowData);
    });
    
    doc.autoTable({
      startY: 44,
      head: [['#', 'Planned', 'Paid Date', 'Amount', 'Remaining', 'Remark']],
      body: rows,
      theme: 'striped',
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [0, 119, 182] }
    });
    
    doc.save(fileName);
  };

  document.getElementById('moreDetailsBtn').onclick = () => {
    window.location.href = 'details.html';
  };

  document.getElementById('addPaymentBtn').onclick = async () => {
    const amt = parseFloat(prompt("Enter Amount (₹):"));
    if(isNaN(amt) || amt <= 0) {
      alert("Valid amount required.");
      return;
    }
    const dt = prompt("Date (YYYY-MM-DD):", new Date().toISOString().slice(0,10));
    if(!dt) return;
    const remark = prompt("Remark (optional):", "");
    if(remark !== null) {
      await processPayment(currentLoanId, dt, amt, remark);
    }
  };

  document.getElementById('refreshBtn').onclick = () => loadData();

  // Initialization
  currentRole = getRoleFromUrl();
  document.getElementById('roleBadge').innerText = currentRole === 'admin' ? "Admin Mode" : "Viewer Mode";
  if(currentRole === 'admin') document.getElementById('adminAddBtn').style.display = 'block';
  loadData();
</script>
</body>
</html>
