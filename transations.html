<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vsquar · Transaction Manager</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 100%;
      width: 85%;
      margin: 20px auto;
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0077b6;
      font-size: 1.7em;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 0.85em;
    }
    input, select {
      width: 40%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.85em;
    }
    .output {
      background: #e0f7fa;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85em;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #00b4d8;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.85em;
    }
    button.small-btn {
      width: auto;
      padding: 5px 10px;
      margin: 0 3px;
      display: inline-block;
      font-size: 0.7em;
    }
    button.danger { background: #dc3545; }
    button.warning { background: #f4a261; }
    button.success { background: #2a9d8f; }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.75em;
      overflow-x: auto;
      display: block;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #90e0ef;
    }
    .text-muted {
      color: #666;
      font-size: 0.7em;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      background: #0077b6;
      color: #fff;
      padding: 10px;
      font-size: 0.75em;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .container { width: 90%; padding: 10px; }
      input, select { width: 100%; }
    }
    .role-badge {
      text-align: right;
      font-size: 0.7rem;
      margin-bottom: 10px;
      color: #0077b6;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="role-badge" id="roleBadge"></div>
  <div class="flex-row">
    <h1>Vsquar · Transaction Manager</h1>
    <button id="backBtn" class="small-btn" style="background:#6c757d;">← Home</button>
  </div>
  
  <div class="flex-row">
    <select id="loanSelect" style="flex:2;"></select>
    <button id="refreshBtn" class="small-btn">⟳ Sync</button>
    <button id="downloadPdfBtn" class="small-btn success">📎 Save PDF</button>
  </div>
  
  <div id="loanSummary" class="output" style="margin-top:5px;">Select a loan to view details</div>
  
  <div id="adminAddBtn" style="display:none; margin:10px 0;">
    <button id="addPaymentBtn" class="success">➕ Add New Payment</button>
  </div>
  
  <div style="overflow-x: auto;">
    <table id="transactionTable" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Planned Date</th>
          <th>Paid Date</th>
          <th>Amount (₹)</th>
          <th>Balance (₹)</th>
          <th>Remark</th>
          <th class="action-col">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="noDataMsg" class="text-muted" style="text-align:center; padding:20px;">No loan data found.</div>
  <div class="footer">Vsquar · Equal Partners</div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
    authDomain: "csl-calculations.firebaseapp.com",
    projectId: "csl-calculations",
    storageBucket: "csl-calculations.firebasestorage.app",
    messagingSenderId: "887219643486",
    appId: "1:887219643486:web:0cb001f2c72039a00240cf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "VSQURE";
  const DOC_ID = "appData";

  let customers = [], loans = [], transactions = [], cashCapital = 0;
  let currentRole = "viewer";
  let currentLoanId = null;

  function getRoleFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('role') === 'admin' ? 'admin' : 'viewer';
  }

  async function loadData() {
    try {
      const doc = await db.collection(COLLECTION).doc(DOC_ID).get();
      if(doc.exists) {
        const d = doc.data();
        customers = d.customers || [];
        loans = d.loans || [];
        transactions = d.transactions || [];
        cashCapital = d.cashCapital || 0;
      }
      populateLoanSelect();
      if(currentLoanId) renderTable();
    } catch(e) { console.error(e); }
  }

  function getCustomer(id) { return customers.find(c => c.id == id); }
  function getLoan(id) { return loans.find(l => l.id == id); }

  function recomputePrincipal(loan) {
    if(loan.method == 1) return loan.status === 'closed' ? 0 : loan.principalAmount;
    let remaining = loan.principalAmount;
    transactions.filter(t => t.loanId == loan.id).forEach(t => {
      remaining -= (t.principalPortion || 0);
    });
    return remaining < 0 ? 0 : remaining;
  }

  function generateSchedule(loan) {
    if(!loan) return [];
    const startDate = new Date(loan.startDate);
    let schedule = [];
    if(loan.method == 3) { // Monthly EMI
      for(let i=1; i<=(loan.tenure || 1); i++) {
        let due = new Date(startDate);
        due.setMonth(startDate.getMonth() + i);
        schedule.push({ planned: due.toISOString().slice(0,10), expected: loan.emiAmount });
      }
    } else if(loan.method == 4) { // Weekly EMI
      for(let i=1; i<=(loan.tenure || 44); i++) {
        let due = new Date(startDate);
        due.setDate(startDate.getDate() + (i*7));
        schedule.push({ planned: due.toISOString().slice(0,10), expected: loan.weeklyAmount });
      }
    }
    return schedule;
  }

  function renderTable() {
    const loan = getLoan(currentLoanId);
    if(!loan) {
      document.getElementById('transactionTable').style.display = 'none';
      document.getElementById('noDataMsg').style.display = 'block';
      return;
    }

    document.getElementById('noDataMsg').style.display = 'none';
    document.getElementById('transactionTable').style.display = 'table';
    
    const cust = getCustomer(loan.customerId);
    document.getElementById('loanSummary').innerHTML = `
      <strong>${cust ? cust.name : 'Unknown'}</strong> | Loan: ₹${loan.principalAmount} | Status: ${loan.status.toUpperCase()}
    `;

    const schedule = generateSchedule(loan);
    const loanTxns = transactions.filter(t => t.loanId == loan.id).sort((a,b) => new Date(a.date) - new Date(b.date));
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    let runningPrincipal = loan.principalAmount;
    
    // logic to combine schedule and payments
    if(schedule.length > 0) {
      schedule.forEach((sch, idx) => {
        const tr = tbody.insertRow();
        let matched = loanTxns[idx]; // simple mapping by index for EMI
        
        tr.insertCell(0).innerText = idx + 1;
        tr.insertCell(1).innerText = sch.planned;
        tr.insertCell(2).innerText = matched ? matched.date : "—";
        tr.insertCell(3).innerText = matched ? `₹${matched.amount}` : "—";
        
        if(matched) runningPrincipal -= (matched.principalPortion || 0);
        tr.insertCell(4).innerText = `₹${Math.max(0, runningPrincipal).toFixed(2)}`;
        tr.insertCell(5).innerText = matched ? (matched.remark || "") : "";
        
        const actionCell = tr.insertCell(6);
        if(currentRole === 'admin') {
            if(matched) {
                actionCell.innerHTML = `<button class="small-btn danger" onclick="deleteTxn(${matched.id})">🗑</button>`;
            } else {
                actionCell.innerHTML = `<button class="small-btn success" onclick="payPlanned('${sch.planned}', ${sch.expected})">+ Pay</button>`;
            }
        }
      });
    } else {
      // Standard list for Interest Only / Flexible
      loanTxns.forEach((txn, idx) => {
        const tr = tbody.insertRow();
        runningPrincipal -= (txn.principalPortion || 0);
        tr.insertCell(0).innerText = idx + 1;
        tr.insertCell(1).innerText = "—";
        tr.insertCell(2).innerText = txn.date;
        tr.insertCell(3).innerText = `₹${txn.amount}`;
        tr.insertCell(4).innerText = `₹${Math.max(0, runningPrincipal).toFixed(2)}`;
        tr.insertCell(5).innerText = txn.remark || "";
        const actionCell = tr.insertCell(6);
        if(currentRole === 'admin') {
          actionCell.innerHTML = `<button class="small-btn danger" onclick="deleteTxn(${txn.id})">🗑</button>`;
        }
      });
    }

    if(currentRole !== 'admin') {
        document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');
        const rows = tbody.rows;
        for(let i=0; i<rows.length; i++) rows[i].deleteCell(-1);
    }
  }

  function populateLoanSelect() {
    const select = document.getElementById('loanSelect');
    select.innerHTML = '<option value="">-- Choose Loan --</option>';
    loans.forEach(l => {
      const c = getCustomer(l.customerId);
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = `${c ? c.name : 'N/A'} - ₹${l.principalAmount}`;
      if(currentLoanId == l.id) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = (e) => {
      currentLoanId = e.target.value;
      renderTable();
    };
  }

  // Admin Actions
  window.payPlanned = async (date, amount) => {
    const remark = prompt("Any remark?");
    await processPayment(currentLoanId, date, amount, remark);
  };

  window.deleteTxn = async (id) => {
    if(!confirm("Delete this payment?")) return;
    const idx = transactions.findIndex(t => t.id == id);
    if(idx > -1) {
      cashCapital -= transactions[idx].amount;
      transactions.splice(idx, 1);
      await saveToCloud();
      await loadData();
    }
  };

  async function processPayment(loanId, date, amount, remark) {
    const loan = getLoan(loanId);
    let outstanding = recomputePrincipal(loan);
    let intPortion = 0, prinPortion = 0;

    if(loan.method == 4) { // Weekly
        prinPortion = amount;
    } else {
        const monthlyRate = loan.interestRate / 100;
        let interestDue = parseFloat((outstanding * monthlyRate).toFixed(2));
        if(loan.method == 3) { // Monthly EMI
            intPortion = interestDue;
            prinPortion = amount - intPortion;
        } else {
            intPortion = amount; // Interest only
        }
    }

    const newTxn = {
      id: Date.now(),
      loanId: loan.id,
      date: date,
      amount: amount,
      interestPortion: intPortion,
      principalPortion: prinPortion,
      remark: remark || "",
      timestamp: new Date().toISOString()
    };

    transactions.push(newTxn);
    cashCapital += amount;
    if(recomputePrincipal(loan) <= 1) loan.status = 'closed';
    
    await saveToCloud();
    await loadData();
  }

  async function saveToCloud() {
    await db.collection(COLLECTION).doc(DOC_ID).set({
      customers, loans, transactions, cashCapital, lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  // PDF Export
  document.getElementById('downloadPdfBtn').onclick = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const loan = getLoan(currentLoanId);
    const cust = getCustomer(loan.customerId);
    
    doc.setFontSize(18);
    doc.text(`Payment Receipt - ${cust ? cust.name : 'Vsquar'}`, 14, 20);
    doc.setFontSize(10);
    doc.text(`Loan Amount: ₹${loan.principalAmount} | Method: ${loan.method}`, 14, 30);
    
    const rows = [];
    document.querySelectorAll('#tableBody tr').forEach(tr => {
      const data = [];
      tr.querySelectorAll('td').forEach((td, idx) => {
          if(idx < 6) data.push(td.innerText);
      });
      rows.push(data);
    });

    doc.autoTable({
      startY: 35,
      head: [['#', 'Planned', 'Paid Date', 'Amount', 'Balance', 'Remark']],
      body: rows,
    });
    doc.save(`Vsquar_Receipt_${currentLoanId}.pdf`);
  };

  document.getElementById('backBtn').onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('refreshBtn').onclick = () => loadData();
  document.getElementById('addPaymentBtn').onclick = () => {
      const amt = parseFloat(prompt("Enter Amount:"));
      const dt = prompt("Date (YYYY-MM-DD):", new Date().toISOString().slice(0,10));
      if(amt > 0 && dt) processPayment(currentLoanId, dt, amt, "Manual Entry");
  };

  // Init
  currentRole = getRoleFromUrl();
  document.getElementById('roleBadge').innerText = currentRole === 'admin' ? "Admin Mode" : "Viewer Mode";
  if(currentRole === 'admin') document.getElementById('adminAddBtn').style.display = 'block';
  loadData();

</script>
</body>
</html>
