<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vsquar · Transaction Manager</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; color: #333; }
    .container { max-width: 100%; width: 85%; margin: 20px auto; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #0077b6; font-size: 1.7em; margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85em; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.9em; }
    .loan-select-wrapper { margin: 10px 0; width: 100%; }
    #loanSelect { width: 100%; min-width: 60mm; padding: 10px; font-size: 0.9em; }
    .output { background: #e0f7fa; padding: 10px; margin-top: 15px; border-radius: 8px; text-align: center; font-size: 0.85em; }
    button { margin-top: 15px; padding: 10px; border: none; border-radius: 8px; background: #00b4d8; color: #fff; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85em; }
    button.small-btn { width: auto; padding: 5px 10px; margin: 0 3px; display: inline-block; font-size: 0.7em; }
    button.danger { background: #dc3545; }
    button.warning { background: #f4a261; }
    button.success { background: #2a9d8f; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.75em; overflow-x: auto; display: block; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
    th { background: #90e0ef; }
    .text-muted { color: #666; font-size: 0.7em; }
    .footer { text-align: center; margin-top: 20px; background: #0077b6; color: #fff; padding: 10px; font-size: 0.75em; border-radius: 8px; }
    @media (max-width: 600px) { .container { width: 90%; padding: 10px; } #loanSelect { width: 100%; } }
    .role-badge { text-align: right; font-size: 0.7rem; margin-bottom: 10px; color: #0077b6; }
    .payment-panel { background: #f8f9fa; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
    .due-alert-row { background: #fff3cd; border-left: 4px solid #ffc107; padding: 8px 12px; margin-bottom: 8px; border-radius: 6px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .section-title { font-weight: bold; margin: 15px 0 8px 0; color: #0077b6; font-size: 0.9rem; }
    .paid-late { color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="role-badge" id="roleBadge"></div>
  <div class="flex-row">
    <h1>Vsquar · Transaction Manager</h1>
  </div>
  
  <div class="loan-select-wrapper">
    <select id="loanSelect"></select>
  </div>
  
  <div class="flex-row">
    <button id="refreshBtn" class="small-btn">⟳ Sync</button>
    <button id="downloadPdfBtn" class="small-btn success">📎 Save PDF</button>
    <button id="homeBtn" class="small-btn" style="background:#6c757d;">🏠 Home</button>
  </div>
  
  <!-- Due Alerts Section -->
  <div id="dueAlertsSection" style="display:none; margin-bottom: 15px;">
    <div class="section-title">📅 Upcoming Due Alerts (Next 3 days)</div>
    <div id="dueAlertsContainer"></div>
  </div>
  
  <div id="loanSummary" class="output" style="margin-top:5px;">Select a loan to view details</div>
  
  <div id="adminAddBtn" style="display:none; margin:10px 0;">
    <div class="payment-panel" id="paymentPanel">
      <h4>➕ Add Payment</h4>
      <div id="paymentFields"></div>
      <button id="addPaymentBtn" class="success">Confirm Payment</button>
    </div>
  </div>
  
  <div style="overflow-x: auto;">
    <table id="transactionTable" style="display:none;">
      <thead><tr><th>#</th><th id="plannedDateHeader">Planned Date</th><th>DuePaid Date</th><th>Amount (₹)</th><th>Interest (₹)</th><th>Principal (₹)</th><th>Principal Balance (₹)</th><th>Remark</th><th class="action-col">Actions</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="noDataMsg" class="text-muted" style="text-align:center; padding:20px;">No loan data found.</div>
  <div class="footer">Vsquar · Equal Partners</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
    authDomain: "csl-calculations.firebaseapp.com",
    projectId: "csl-calculations",
    storageBucket: "csl-calculations.firebasestorage.app",
    messagingSenderId: "887219643486",
    appId: "1:887219643486:web:0cb001f2c72039a00240cf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "VSQURE";
  const DOC_ID = "appData";

  let customers = [], loans = [], transactions = [], cashCapital = 0;
  let currentRole = "viewer";
  let currentLoanId = null;

  function getRoleFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('role') === 'admin' ? 'admin' : 'viewer';
  }

  function formatDateDMY(dateStr) {
    if (!dateStr) return '';
    let parts = dateStr.split('-');
    if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
    return dateStr;
  }

  function convertToYMD(dateStr) {
    if (!dateStr) return '';
    let parts = dateStr.split('-');
    if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
    return dateStr;
  }

  async function loadData() {
    try {
      const doc = await db.collection(COLLECTION).doc(DOC_ID).get();
      if(doc.exists) {
        const d = doc.data();
        customers = d.customers || [];
        loans = d.loans || [];
        transactions = d.transactions || [];
        cashCapital = d.cashCapital || 0;
      }
      populateLoanSelect();
      showDueAlerts();
      if(currentLoanId) {
        renderTable();
        updatePaymentFields();
      }
    } catch(e) { console.error(e); }
  }

  function getCustomer(id) { return customers.find(c => c.id == id); }
  function getLoan(id) { return loans.find(l => l.id == id); }

  function getTotalExpectedForLoan(loan) {
    if(loan.method == 4) return (loan.weeklyAmount || 250) * (loan.tenure || 44);
    else if(loan.method == 3) return (loan.emiAmount || 0) * (loan.tenure || 1);
    else return loan.principalAmount;
  }

  function getPrincipalOutstanding(loan) {
    let remaining = loan.principalAmount;
    transactions.filter(t => t.loanId == loan.id).forEach(t => { 
      remaining -= (t.principalPortion || 0); 
    });
    return Math.max(0, remaining);
  }

  function calculateAccruedInterest(loan) {
    if (loan.method === 1 || loan.method === 2) {
      const monthlyRate = loan.interestRate / 100;
      const dailyRate = monthlyRate / 30;
      const startDate = loan.startDate ? new Date(loan.startDate) : new Date();
      const today = new Date();
      let totalInterest = 0;
      let runningPrincipal = loan.principalAmount;
      const sortedTxns = transactions.filter(t => t.loanId === loan.id).sort((a,b) => new Date(a.date) - new Date(b.date));
      let lastDate = startDate;
      
      for (const txn of sortedTxns) {
        const txnDate = new Date(txn.date);
        const daysDiff = Math.max(0, Math.floor((txnDate - lastDate) / (1000 * 60 * 60 * 24)));
        totalInterest += runningPrincipal * dailyRate * daysDiff;
        runningPrincipal -= (txn.principalPortion || 0);
        lastDate = txnDate;
      }
      
      const finalDaysDiff = Math.max(0, Math.floor((today - lastDate) / (1000 * 60 * 60 * 24)));
      totalInterest += runningPrincipal * dailyRate * finalDaysDiff;
      
      return parseFloat(totalInterest.toFixed(2));
    }
    return 0;
  }

  function getInterestEarned(loan) {
    return transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + (t.interestPortion || 0), 0);
  }

  function getInterestBalance(loan) {
    if (loan.method === 1 || loan.method === 2) {
      const accruedTotal = calculateAccruedInterest(loan);
      const paidInterest = getInterestEarned(loan);
      return Math.max(0, accruedTotal - paidInterest);
    } else if (loan.method === 3 || loan.method === 4) {
      const totalExpected = getTotalExpectedForLoan(loan);
      const totalPaid = transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + t.amount, 0);
      const principalOut = getPrincipalOutstanding(loan);
      const remainingInterest = Math.max(0, totalExpected - totalPaid - principalOut);
      return remainingInterest;
    }
    return 0;
  }

  function generateSchedule(loan) {
    if(!loan) return [];
    if (loan.method !== 3 && loan.method !== 4) return [];
    const startDate = new Date(loan.startDate);
    let schedule = [];
    if(loan.method == 3) {
      for(let i=1; i<=(loan.tenure || 1); i++) {
        let due = new Date(startDate);
        due.setMonth(startDate.getMonth() + i);
        schedule.push({ planned: due.toISOString().slice(0,10), expected: loan.emiAmount, index: i });
      }
    } else if(loan.method == 4) {
      for(let i=1; i<=(loan.tenure || 44); i++) {
        let due = new Date(startDate);
        due.setDate(startDate.getDate() + (i*7));
        schedule.push({ planned: due.toISOString().slice(0,10), expected: loan.weeklyAmount, index: i });
      }
    }
    return schedule;
  }

  function showDueAlerts() {
    const alertsContainer = document.getElementById('dueAlertsContainer');
    const alertsSection = document.getElementById('dueAlertsSection');
    if (!alertsContainer) return;
    
    const today = new Date();
    today.setHours(0,0,0,0);
    const threeDaysLater = new Date(today);
    threeDaysLater.setDate(today.getDate() + 3);
    
    const alerts = [];
    
    loans.forEach(loan => {
      if (loan.status === 'closed') return;
      if (loan.method !== 3 && loan.method !== 4) return;
      
      const schedule = generateSchedule(loan);
      const cust = getCustomer(loan.customerId);
      const customerName = cust ? cust.name : 'Unknown';
      const loanTxns = transactions.filter(t => t.loanId == loan.id).sort((a,b) => new Date(a.date) - new Date(b.date));
      
      for (let i = 0; i < schedule.length; i++) {
        const inst = schedule[i];
        const dueDate = new Date(inst.planned);
        
        const isPaid = i < loanTxns.length;
        if (isPaid) continue;
        
        if (dueDate >= today && dueDate <= threeDaysLater) {
          alerts.push({
            loanNumber: loan.loanNumber,
            customerName: customerName,
            dueDate: inst.planned,
            dueDateStr: formatDateDMY(inst.planned),
            amount: inst.expected,
            installmentNum: i + 1
          });
        }
      }
    });
    
    alerts.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
    
    if (alerts.length > 0) {
      alertsSection.style.display = 'block';
      alertsContainer.innerHTML = alerts.map(a => `
        <div class="due-alert-row">
          <span><strong>Loan #${a.loanNumber}</strong> - ${a.customerName}</span>
          <span>Due: ${a.dueDateStr}</span>
          <span>Amount: ₹${a.amount}</span>
          <span>Installment #${a.installmentNum}</span>
        </div>
      `).join('');
    } else {
      alertsSection.style.display = 'none';
    }
  }

  function renderTable() {
    const loan = getLoan(currentLoanId);
    if(!loan) {
      document.getElementById('transactionTable').style.display = 'none';
      document.getElementById('noDataMsg').style.display = 'block';
      return;
    }

    document.getElementById('noDataMsg').style.display = 'none';
    document.getElementById('transactionTable').style.display = 'table';
    
    const cust = getCustomer(loan.customerId);
    const principalOut = getPrincipalOutstanding(loan);
    const interestEarned = getInterestEarned(loan);
    const interestBalance = getInterestBalance(loan);
    
    document.getElementById('loanSummary').innerHTML = `
      <strong>Loan #${loan.loanNumber} - ${cust ? cust.name : 'Unknown'}</strong><br>
      Principal Balance: ₹${principalOut.toFixed(2)} | 
      Interest Earned: ₹${interestEarned.toFixed(2)} | 
      Interest Balance: ₹${interestBalance.toFixed(2)}<br>
      Status: ${loan.status.toUpperCase()}
    `;

    const isEMIorWeekly = (loan.method === 3 || loan.method === 4);
    const plannedHeader = document.getElementById('plannedDateHeader');
    
    if (isEMIorWeekly) {
      plannedHeader.style.display = 'table-cell';
    } else {
      plannedHeader.style.display = 'none';
    }

    const schedule = generateSchedule(loan);
    const loanTxns = transactions.filter(t => t.loanId == loan.id).sort((a,b) => new Date(a.date) - new Date(b.date));
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (isEMIorWeekly && schedule.length > 0) {
      // Show all schedule rows, but only show balance for paid ones
      let cumulativePrincipal = 0;
      
      for (let idx = 0; idx < schedule.length; idx++) {
        const tr = tbody.insertRow();
        const matched = (idx < loanTxns.length) ? loanTxns[idx] : null;
        const plannedDate = schedule[idx].planned;
        const isPaid = matched !== null;
        
        tr.insertCell(0).innerText = idx + 1;
        tr.insertCell(1).innerText = formatDateDMY(plannedDate);
        
        if (matched) {
          const paidDate = matched.date;
          const isLate = new Date(paidDate) > new Date(plannedDate);
          const dateClass = isLate ? 'paid-late' : '';
          tr.insertCell(2).innerHTML = `<span class="${dateClass}">${formatDateDMY(paidDate)}</span>`;
          tr.insertCell(3).innerText = `₹${matched.amount}`;
          tr.insertCell(4).innerText = `₹${matched.interestPortion || 0}`;
          tr.insertCell(5).innerText = `₹${matched.principalPortion || 0}`;
          cumulativePrincipal += (matched.principalPortion || 0);
          const remainingPrincipal = Math.max(0, loan.principalAmount - cumulativePrincipal);
          tr.insertCell(6).innerText = `₹${remainingPrincipal.toFixed(2)}`;
          tr.insertCell(7).innerText = matched.remark || "";
        } else {
          tr.insertCell(2).innerText = "—";
          tr.insertCell(3).innerText = "—";
          tr.insertCell(4).innerText = "—";
          tr.insertCell(5).innerText = "—";
          tr.insertCell(6).innerText = "—";
          tr.insertCell(7).innerText = "—";
        }
        
        const actionCell = tr.insertCell(8);
        if(currentRole === 'admin') {
          if(matched) {
            actionCell.innerHTML = `<button class="small-btn danger" onclick="deleteTxn(${matched.id})">🗑</button>`;
          } else {
            actionCell.innerHTML = `<button class="small-btn success" onclick="payPlanned('${plannedDate}', ${schedule[idx].expected})">+ Pay</button>`;
          }
        } else {
          actionCell.innerHTML = "";
        }
      }
    } 
    else {
      let cumulativePrincipal = 0;
      
      loanTxns.forEach((txn, idx) => {
        const tr = tbody.insertRow();
        cumulativePrincipal += (txn.principalPortion || 0);
        const remainingPrincipal = Math.max(0, loan.principalAmount - cumulativePrincipal);
        
        tr.insertCell(0).innerText = idx + 1;
        tr.insertCell(1).innerText = "—";
        tr.insertCell(2).innerText = formatDateDMY(txn.date);
        tr.insertCell(3).innerText = `₹${txn.amount}`;
        tr.insertCell(4).innerText = `₹${txn.interestPortion || 0}`;
        tr.insertCell(5).innerText = `₹${txn.principalPortion || 0}`;
        tr.insertCell(6).innerText = `₹${remainingPrincipal.toFixed(2)}`;
        tr.insertCell(7).innerText = txn.remark || "";
        
        const actionCell = tr.insertCell(8);
        if(currentRole === 'admin') {
          actionCell.innerHTML = `<button class="small-btn danger" onclick="deleteTxn(${txn.id})">🗑</button>`;
        } else {
          actionCell.innerHTML = "";
        }
      });
      
      if (loanTxns.length === 0) {
        const tr = tbody.insertRow();
        tr.insertCell(0).innerText = "—";
        tr.insertCell(1).innerText = "—";
        tr.insertCell(2).innerText = "—";
        tr.insertCell(3).innerText = "—";
        tr.insertCell(4).innerText = "—";
        tr.insertCell(5).innerText = "—";
        tr.insertCell(6).innerText = `₹${loan.principalAmount.toFixed(2)}`;
        tr.insertCell(7).innerText = "—";
        const actionCell = tr.insertCell(8);
        actionCell.innerHTML = "";
      }
    }

    if(currentRole !== 'admin') {
      const actionHeaders = document.querySelectorAll('.action-col');
      actionHeaders.forEach(el => el.style.display = 'none');
      const rows = tbody.rows;
      for(let i=0; i<rows.length; i++) {
        if(rows[i].cells.length > 8) rows[i].deleteCell(8);
      }
    } else {
      const actionHeaders = document.querySelectorAll('.action-col');
      actionHeaders.forEach(el => el.style.display = 'table-cell');
    }
  }

  function populateLoanSelect() {
    const select = document.getElementById('loanSelect');
    select.innerHTML = '<option value="">-- Choose Loan --</option>';
    // Sort: active first, then closed
    const sortedLoans = [...loans].sort((a,b) => {
      if (a.status === 'closed' && b.status !== 'closed') return 1;
      if (a.status !== 'closed' && b.status === 'closed') return -1;
      return 0;
    });
    sortedLoans.forEach(l => {
      const c = getCustomer(l.customerId);
      const principalOut = getPrincipalOutstanding(l);
      const statusText = l.status === 'closed' ? ' [CLOSED]' : '';
      const optionText = `#${l.loanNumber} - ${c ? c.name : 'N/A'}${statusText} | Balance: ₹${principalOut.toFixed(2)}`;
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = optionText;
      if(currentLoanId == l.id) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = (e) => {
      currentLoanId = e.target.value ? parseInt(e.target.value) : null;
      renderTable();
      updatePaymentFields();
    };
  }

  function updatePaymentFields() {
    const loan = getLoan(currentLoanId);
    const container = document.getElementById('paymentFields');
    if(!container || currentRole !== 'admin') return;
    if(!loan) {
      container.innerHTML = '<p class="text-muted">Select a loan first</p>';
      return;
    }
    
    if(loan.method === 1) {
      container.innerHTML = `
        <label>Interest Portion (₹)</label>
        <input type="number" id="interestPortion" placeholder="Interest amount" step="any" value="0">
        <label>Principal Portion (₹)</label>
        <input type="number" id="principalPortion" placeholder="Principal amount" step="any" value="0">
        <label>Date (DD-MM-YYYY)</label>
        <input type="text" id="paymentDate" placeholder="DD-MM-YYYY" value="${formatDateDMY(new Date().toISOString().slice(0,10))}">
        <label>Remark</label>
        <input type="text" id="paymentRemark" placeholder="Optional">
        <small class="text-muted">Total amount = Interest + Principal</small>
      `;
    } else {
      container.innerHTML = `
        <label>Amount (₹)</label>
        <input type="number" id="paymentAmount" placeholder="Enter amount" step="any">
        <label>Date (DD-MM-YYYY)</label>
        <input type="text" id="paymentDate" placeholder="DD-MM-YYYY" value="${formatDateDMY(new Date().toISOString().slice(0,10))}">
        <label>Remark</label>
        <input type="text" id="paymentRemark" placeholder="Optional">
      `;
    }
  }

  async function processPayment(loanId, date, amount, interestPortion, principalPortion, remark) {
    const loan = getLoan(loanId);
    if(!loan) return { success: false, msg: "Loan not found" };
    if(loan.status === 'closed') return { success: false, msg: "Loan already closed" };
    
    const isoDate = convertToYMD(date);
    if (!isoDate || isoDate.length !== 10) {
      return { success: false, msg: "Invalid date format. Use DD-MM-YYYY" };
    }
    
    if(loan.method === 1) {
      if(interestPortion < 0 || principalPortion < 0) return { success: false, msg: "Portions cannot be negative" };
      const total = interestPortion + principalPortion;
      if(total <= 0) return { success: false, msg: "Total amount must be positive" };
      
      const principalOut = getPrincipalOutstanding(loan);
      if(principalPortion > principalOut) {
        return { success: false, msg: `Principal portion cannot exceed outstanding principal ₹${principalOut}` };
      }
      
      const newTxn = {
        id: Date.now(),
        loanId: loan.id,
        date: isoDate,
        amount: total,
        interestPortion: interestPortion,
        principalPortion: principalPortion,
        remark: remark || "",
        timestamp: new Date().toISOString()
      };
      transactions.push(newTxn);
      cashCapital += total;
      
      const totalPaidPrincipal = transactions.filter(t => t.loanId == loan.id).reduce((s,t) => s + (t.principalPortion || 0), 0);
      if(totalPaidPrincipal >= loan.principalAmount - 0.01) loan.status = 'closed';
      else loan.status = 'active';
      
      await saveToCloud();
      await loadData();
      return { success: true };
    }
    
    if(amount <= 0) return { success: false, msg: "Amount must be positive" };
    
    let interestPortionAuto = 0, principalPortionAuto = 0;
    
    if(loan.method === 4) {
      let principalRemaining = getPrincipalOutstanding(loan);
      if (principalRemaining > 0) {
        if (amount <= principalRemaining) {
          principalPortionAuto = amount;
          interestPortionAuto = 0;
        } else {
          principalPortionAuto = principalRemaining;
          interestPortionAuto = amount - principalRemaining;
        }
      } else {
        principalPortionAuto = 0;
        interestPortionAuto = amount;
      }
    } 
    else if(loan.method === 3) {
      const monthlyRate = loan.interestRate / 100;
      let principalRemaining = getPrincipalOutstanding(loan);
      let interestDue = principalRemaining * monthlyRate;
      interestDue = parseFloat(interestDue.toFixed(2));
      if(amount <= interestDue) {
        interestPortionAuto = amount;
        principalPortionAuto = 0;
      } else {
        interestPortionAuto = interestDue;
        principalPortionAuto = amount - interestDue;
        if(principalPortionAuto > principalRemaining) principalPortionAuto = principalRemaining;
      }
    }
    else {
      let principalRemaining = getPrincipalOutstanding(loan);
      const monthlyRate = loan.interestRate / 100;
      const loanTxns = transactions.filter(t=>t.loanId===loan.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
      let lastDate = loan.startDate ? new Date(loan.startDate) : new Date();
      if(loanTxns.length) lastDate = new Date(loanTxns[0].date);
      let currentDate = new Date(isoDate);
      if(isNaN(currentDate)) currentDate = new Date();
      const diffDays = Math.max(1, Math.ceil((currentDate - lastDate)/(1000*60*60*24)));
      const dailyRate = monthlyRate/30;
      let interestAccrued = principalRemaining * dailyRate * diffDays;
      interestAccrued = parseFloat(interestAccrued.toFixed(2));
      
      if(amount <= interestAccrued) {
        interestPortionAuto = amount;
        principalPortionAuto = 0;
      } else {
        interestPortionAuto = interestAccrued;
        principalPortionAuto = amount - interestAccrued;
        if(principalPortionAuto > principalRemaining) principalPortionAuto = principalRemaining;
      }
    }
    
    const newTxn = {
      id: Date.now(),
      loanId: loan.id,
      date: isoDate,
      amount: amount,
      interestPortion: interestPortionAuto,
      principalPortion: principalPortionAuto,
      remark: remark || "",
      timestamp: new Date().toISOString()
    };
    transactions.push(newTxn);
    cashCapital += amount;
    
    const totalPaidPrincipal = transactions.filter(t => t.loanId == loan.id).reduce((s,t) => s + (t.principalPortion || 0), 0);
    if(totalPaidPrincipal >= loan.principalAmount - 0.01) loan.status = 'closed';
    else loan.status = 'active';
    
    await saveToCloud();
    await loadData();
    return { success: true };
  }

  window.payPlanned = async (plannedDate, expectedAmount) => {
    const todayDate = formatDateDMY(new Date().toISOString().slice(0,10));
    const remark = prompt("Enter remark (optional):", "");
    if(remark !== null) {
      const result = await processPayment(currentLoanId, todayDate, expectedAmount, 0, 0, remark);
      if(result.success) {
        if(currentRole === 'admin') alert("Payment recorded successfully!");
      } else alert(result.msg);
    }
  };

  window.deleteTxn = async (id) => {
    if(!confirm("Delete this payment?")) return;
    const idx = transactions.findIndex(t => t.id == id);
    if(idx > -1) {
      cashCapital -= transactions[idx].amount;
      transactions.splice(idx, 1);
      const loan = getLoan(currentLoanId);
      if(loan) {
        const totalPaidPrincipal = transactions.filter(t => t.loanId == loan.id).reduce((s,t) => s + (t.principalPortion || 0), 0);
        if(totalPaidPrincipal >= loan.principalAmount - 0.01) loan.status = 'closed';
        else loan.status = 'active';
      }
      await saveToCloud();
      await loadData();
    }
  };

  async function saveToCloud() {
    if(currentRole !== 'admin') return;
    await db.collection(COLLECTION).doc(DOC_ID).set({
      customers, loans, transactions, cashCapital, lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  document.getElementById('addPaymentBtn').onclick = async () => {
    const loan = getLoan(currentLoanId);
    if(!loan) { alert("Select a loan first"); return; }
    const dateInput = document.getElementById('paymentDate').value;
    if(!dateInput) { alert("Enter date"); return; }
    const remark = document.getElementById('paymentRemark').value;
    
    if(loan.method === 1) {
      const interest = parseFloat(document.getElementById('interestPortion').value);
      const principal = parseFloat(document.getElementById('principalPortion').value);
      if(isNaN(interest) || isNaN(principal)) { alert("Enter valid numbers"); return; }
      const total = interest + principal;
      if(total <= 0) { alert("Total amount must be positive"); return; }
      const result = await processPayment(currentLoanId, dateInput, total, interest, principal, remark);
      if(result.success) {
        if(currentRole === 'admin') alert("Payment recorded successfully!");
        document.getElementById('interestPortion').value = 0;
        document.getElementById('principalPortion').value = 0;
        document.getElementById('paymentRemark').value = '';
      } else alert(result.msg);
    } else {
      const amount = parseFloat(document.getElementById('paymentAmount').value);
      if(isNaN(amount) || amount <= 0) { alert("Enter valid amount"); return; }
      const result = await processPayment(currentLoanId, dateInput, amount, 0, 0, remark);
      if(result.success) {
        if(currentRole === 'admin') alert("Payment recorded successfully!");
        document.getElementById('paymentAmount').value = '';
        document.getElementById('paymentRemark').value = '';
      } else alert(result.msg);
    }
  };

  // PDF Export with border, remark column, and red color for late payments
  document.getElementById('downloadPdfBtn').onclick = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const loan = getLoan(currentLoanId);
    if(!loan) {
      alert("Please select a loan first.");
      return;
    }
    const cust = getCustomer(loan.customerId);
    const customerName = cust ? cust.name : "Vsquar";
    const today = new Date();
    const dateStr = formatDateDMY(today.toISOString().slice(0,10));
    const fileName = `Loan_${loan.loanNumber}_${customerName}_${dateStr}.pdf`;
    const principalOut = getPrincipalOutstanding(loan);
    const interestBalance = getInterestBalance(loan);
    
    // Set page margin: 10mm from all edges
    const margin = 10;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const contentWidth = pageWidth - (margin * 2);
    
    // Draw border box (1mm line, 10mm from edges)
    doc.setLineWidth(0.5);
    doc.rect(margin, margin, pageWidth - (margin * 2), pageHeight - (margin * 2));
    
    doc.setFontSize(18);
    doc.text(`Payment Receipt - Loan #${loan.loanNumber}`, margin + 5, margin + 15);
    doc.setFontSize(12);
    doc.text(`Customer: ${customerName}`, margin + 5, margin + 25);
    doc.setFontSize(10);
    doc.text(`Principal Balance: ${principalOut.toFixed(2)}`, margin + 5, margin + 33);
    doc.text(`Interest Balance: ${interestBalance.toFixed(2)}`, margin + 5, margin + 40);
    if (principalOut <= 0.01) {
      doc.text("Loan Closed", margin + 5, margin + 47);
      doc.text(`Generated on: ${today.toLocaleString()}`, margin + 5, margin + 54);
    } else {
      doc.text(`Generated on: ${today.toLocaleString()}`, margin + 5, margin + 47);
    }
    
    // Build table rows with data
    const rows = [];
    const isEMIorWeekly = (loan.method === 3 || loan.method === 4);
    const tableRows = document.querySelectorAll('#tableBody tr');
    
    for (let tr of tableRows) {
      const rowData = [];
      const cells = tr.querySelectorAll('td');
      for (let i = 0; i < cells.length; i++) {
        if (i === 1 && !isEMIorWeekly) continue;
        if (i === cells.length - 1) continue;
        let cellText = cells[i]?.innerText || '';
        cellText = cellText.replace(/₹/g, '').trim();
        if (cellText !== '—' || (i === 7 && cellText === '—')) {
          rowData.push(cellText);
        } else if (cellText === '—' && i !== 7) {
          rowData.push('');
        } else if (i === 7) {
          rowData.push(cellText);
        }
      }
      if (rowData.length > 0) rows.push(rowData);
    }
    
    let headers = ['#', 'Paid Date', 'Amount', 'Interest', 'Principal', 'Principal Bal', 'Remark'];
    if (isEMIorWeekly) {
      headers = ['#', 'Planned', 'Paid Date', 'Amount', 'Interest', 'Principal', 'Principal Bal', 'Remark'];
    }
    
    let startY = principalOut <= 0.01 ? 60 : 53;
    
    doc.autoTable({
      startY: startY,
      head: [headers],
      body: rows,
      theme: 'striped',
      styles: { fontSize: 7, cellPadding: 2, lineColor: [0, 0, 0], lineWidth: 0.1 },
      headStyles: { fillColor: [0, 119, 182], textColor: [255, 255, 255] },
      margin: { left: margin, right: margin }
    });
    
    doc.save(fileName);
  };

  document.getElementById('homeBtn').onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('refreshBtn').onclick = () => loadData();

  currentRole = getRoleFromUrl();
  document.getElementById('roleBadge').innerText = currentRole === 'admin' ? "Admin Mode" : "Viewer Mode";
  if(currentRole === 'admin') {
    document.getElementById('adminAddBtn').style.display = 'block';
  }
  loadData();
</script>
</body>
</html>
