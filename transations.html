<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vsquar · Transaction Manager</title>
  <!-- Firebase & PDF libs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    /* Compact theme - exactly like main app */
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 100%;
      width: 85%;
      margin: 20px auto;
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0077b6;
      font-size: 1.7em;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 0.85em;
    }
    input, select {
      width: 40%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.85em;
    }
    .output {
      background: #e0f7fa;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85em;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #00b4d8;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.85em;
    }
    button.small-btn {
      width: auto;
      padding: 5px 10px;
      margin: 0 3px;
      display: inline-block;
      font-size: 0.7em;
    }
    button.danger { background: #dc3545; }
    button.warning { background: #f4a261; }
    button.success { background: #2a9d8f; }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.75em;
      overflow-x: auto;
      display: block;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #90e0ef;
    }
    .badge {
      background: #e2e8f0;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7em;
    }
    .text-muted {
      color: #666;
      font-size: 0.7em;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      background: #0077b6;
      color: #fff;
      padding: 10px;
      font-size: 0.75em;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .container { width: 90%; padding: 10px; }
      input, select { width: 100%; }
    }
    .modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background: white; border-radius: 20px; padding: 20px; width: 90%; max-width: 400px;
    }
    .modal-content input, .modal-content select { width: 100%; margin: 8px 0; padding: 8px; border-radius: 8px; border:1px solid #ccc; }
    .flex-btns { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
    .role-badge {
      text-align: right;
      font-size: 0.7rem;
      margin-bottom: 10px;
      color: #0077b6;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="role-badge" id="roleBadge"></div>
  <div class="flex-row">
    <h1>Vsquar · Transaction Manager</h1>
    <button id="backBtn" class="small-btn" style="background:#6c757d;">← Back</button>
  </div>
  
  <!-- Loan selector and summary -->
  <div class="flex-row">
    <select id="loanSelect" style="flex:2;"></select>
    <button id="refreshBtn" class="small-btn">⟳ Refresh</button>
    <button id="downloadPdfBtn" class="small-btn success">📎 PDF Receipt</button>
  </div>
  
  <div id="loanSummary" class="output" style="margin-top:5px;"></div>
  
  <!-- Add payment button (admin only) -->
  <div id="adminAddBtn" style="display:none; margin:10px 0;">
    <button id="addPaymentBtn" class="success">➕ Add Payment</button>
  </div>
  
  <!-- Transaction table -->
  <div style="overflow-x: auto;">
    <table id="transactionTable">
      <thead>
        <tr><th>#</th><th>Planned Date</th><th>Paid Date</th><th>Amount (₹)</th><th>Balance (₹)</th><th>Remark</th><th id="actionHeader">Actions</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="noDataMsg" class="text-muted" style="text-align:center; padding:20px;">Select a loan to view schedule</div>
  <div class="footer">Vsquar · Equal Partners</div>
</div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
    authDomain: "csl-calculations.firebaseapp.com",
    projectId: "csl-calculations",
    storageBucket: "csl-calculations.firebasestorage.app",
    messagingSenderId: "887219643486",
    appId: "1:887219643486:web:0cb001f2c72039a00240cf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "VSQURE";
  const DOC_ID = "appData";

  let customers = [], loans = [], transactions = [], cashCapital = 0;
  let currentRole = "viewer";  // default viewer
  let currentLoanId = null;
  let currentLoan = null;

  // Get role from URL
  function getRoleFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    if(role === 'admin') return 'admin';
    return 'viewer';
  }

  async function loadData() {
    try {
      const doc = await db.collection(COLLECTION).doc(DOC_ID).get();
      if(doc.exists) {
        const d = doc.data();
        customers = d.customers || [];
        loans = d.loans || [];
        transactions = d.transactions || [];
        cashCapital = d.cashCapital || 0;
      } else {
        customers = JSON.parse(localStorage.getItem('vsquar_customers')||'[]');
        loans = JSON.parse(localStorage.getItem('vsquar_loans')||'[]');
        transactions = JSON.parse(localStorage.getItem('vsquar_transactions')||'[]');
      }
      populateLoanSelect();
      if(currentLoanId && loans.some(l=>l.id==currentLoanId)) loadLoanDetails();
      else if(loans.length>0) { currentLoanId = loans[0].id; loadLoanDetails(); }
      else { document.getElementById('noDataMsg').style.display = 'block'; }
    } catch(e) { console.error(e); alert("Error loading"); }
  }

  function getCustomer(id) { return customers.find(c=>c.id==id); }
  function getLoan(id) { return loans.find(l=>l.id==id); }

  function recomputePrincipal(loan) {
    if(loan.method === 1) return loan.status==='closed'?0:loan.principalAmount;
    let remaining = loan.principalAmount;
    transactions.filter(t=>t.loanId===loan.id).sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{ if(t.principalPortion) remaining -= t.principalPortion; });
    return remaining<0?0:remaining;
  }

  // Generate schedule based on loan method
  function generateSchedule(loan) {
    if(!loan) return [];
    const startDate = new Date(loan.startDate);
    if(loan.method === 3) { // monthly EMI
      const months = loan.tenure || 1;
      let schedule = [];
      for(let i=1; i<=months; i++) {
        let due = new Date(startDate);
        due.setMonth(startDate.getMonth() + i);
        schedule.push({ planned: due.toISOString().slice(0,10), expectedAmount: loan.emiAmount });
      }
      return schedule;
    } else if(loan.method === 4) { // weekly EMI
      const weeks = loan.tenure || 44;
      let schedule = [];
      for(let i=1; i<=weeks; i++) {
        let due = new Date(startDate);
        due.setDate(startDate.getDate() + (i*7));
        schedule.push({ planned: due.toISOString().slice(0,10), expectedAmount: loan.weeklyAmount });
      }
      return schedule;
    }
    return [];
  }

  // Build table data: merge schedule with actual payments
  function buildTableData(loan, allTxns) {
    const schedule = generateSchedule(loan);
    if(schedule.length === 0) {
      // No schedule (method 1 or 2): just show actual transactions in order
      const txns = allTxns.filter(t=>t.loanId===loan.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
      let balance = loan.principalAmount;
      let result = [];
      txns.forEach((txn, idx) => {
        balance -= (txn.principalPortion||0);
        result.push({
          sl: idx+1,
          plannedDate: "—",
          paidDate: txn.date,
          amount: txn.amount,
          balance: balance,
          remark: txn.remark || "",
          txnId: txn.id,
          actualTxn: txn
        });
      });
      return result;
    }
    // With schedule
    let result = [];
    let remainingPrincipal = loan.principalAmount;
    let paidPrincipal = 0;
    const sortedTxns = [...allTxns.filter(t=>t.loanId===loan.id)].sort((a,b)=>new Date(a.date)-new Date(b.date));
    let txnIdx = 0;
    for(let i=0; i<schedule.length; i++) {
      const planned = schedule[i].planned;
      let matchedTxn = null;
      if(txnIdx < sortedTxns.length && new Date(sortedTxns[txnIdx].date) <= new Date(planned)) {
        matchedTxn = sortedTxns[txnIdx];
        txnIdx++;
      }
      let paidDate = matchedTxn ? matchedTxn.date : "—";
      let amount = matchedTxn ? matchedTxn.amount : 0;
      let remark = matchedTxn ? (matchedTxn.remark||"") : "";
      let txnId = matchedTxn ? matchedTxn.id : null;
      if(matchedTxn) paidPrincipal += (matchedTxn.principalPortion||0);
      let balanceAfter = loan.principalAmount - paidPrincipal;
      if(balanceAfter < 0) balanceAfter = 0;
      result.push({
        sl: i+1,
        plannedDate: planned,
        paidDate: paidDate,
        amount: amount,
        balance: balanceAfter,
        remark: remark,
        txnId: txnId,
        actualTxn: matchedTxn
      });
    }
    // extra payments after schedule
    while(txnIdx < sortedTxns.length) {
      let extra = sortedTxns[txnIdx];
      result.push({
        sl: result.length+1,
        plannedDate: "Extra",
        paidDate: extra.date,
        amount: extra.amount,
        balance: loan.principalAmount - (paidPrincipal + (extra.principalPortion||0)),
        remark: extra.remark||"",
        txnId: extra.id,
        actualTxn: extra
      });
      paidPrincipal += (extra.principalPortion||0);
      txnIdx++;
    }
    return result;
  }

  async function renderTable() {
    if(!currentLoanId) {
      document.getElementById('noDataMsg').style.display = 'block';
      document.getElementById('transactionTable').style.display = 'none';
      return;
    }
    const loan = getLoan(currentLoanId);
    if(!loan) { document.getElementById('noDataMsg').style.display = 'block'; return; }
    currentLoan = loan;
    const cust = getCustomer(loan.customerId);
    document.getElementById('loanSummary').innerHTML = `
      <strong>${cust?cust.name:'Unknown'}</strong> | Loan: ₹${loan.principalAmount} | Start: ${loan.startDate} | 
      ${loan.method==1?'Interest Only':loan.method==2?'Flexible':loan.method==3?`Monthly EMI ₹${loan.emiAmount}`:`Weekly EMI ₹${loan.weeklyAmount} × ${loan.tenure} wks`}
    `;
    const tableData = buildTableData(loan, transactions);
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    if(tableData.length===0) {
      document.getElementById('noDataMsg').style.display = 'block';
      document.getElementById('transactionTable').style.display = 'none';
      return;
    }
    document.getElementById('noDataMsg').style.display = 'none';
    document.getElementById('transactionTable').style.display = 'table';
    for(let row of tableData) {
      const tr = tbody.insertRow();
      tr.insertCell(0).innerText = row.sl;
      tr.insertCell(1).innerText = row.plannedDate;
      tr.insertCell(2).innerText = row.paidDate;
      tr.insertCell(3).innerText = row.amount>0 ? `₹${row.amount.toFixed(2)}` : '—';
      tr.insertCell(4).innerText = `₹${row.balance.toFixed(2)}`;
      tr.insertCell(5).innerText = row.remark || '';
      const actionCell = tr.insertCell(6);
      if(currentRole === 'admin' && row.txnId && row.actualTxn) {
        const editBtn = document.createElement('button');
        editBtn.innerText = '✏️';
        editBtn.className = 'small-btn';
        editBtn.style.background = '#ffc107';
        editBtn.style.marginRight = '5px';
        editBtn.onclick = () => openEditModal(row.actualTxn);
        const delBtn = document.createElement('button');
        delBtn.innerText = '🗑';
        delBtn.className = 'small-btn danger';
        delBtn.onclick = () => deleteTxnWithConfirm(row.actualTxn.id);
        actionCell.appendChild(editBtn);
        actionCell.appendChild(delBtn);
      } else if(currentRole === 'admin' && !row.txnId && row.plannedDate !== '—' && row.plannedDate !== 'Extra') {
        const addBtn = document.createElement('button');
        addBtn.innerText = '+ Pay';
        addBtn.className = 'small-btn success';
        addBtn.onclick = () => openAddForPlanned(row.plannedDate);
        actionCell.appendChild(addBtn);
      } else {
        actionCell.innerText = '—';
      }
    }
    document.getElementById('actionHeader').style.display = currentRole === 'admin' ? 'table-cell' : 'none';
    document.getElementById('adminAddBtn').style.display = currentRole === 'admin' ? 'block' : 'none';
  }

  async function addTransactionToDB(loanId, date, amount, remark) {
    const loan = getLoan(loanId);
    if(!loan) return { success: false, msg: "Loan not found" };
    let outstanding = recomputePrincipal(loan);
    if(amount <=0) return { success: false, msg: "Amount positive" };
    let interestPortion=0, principalPortion=0;
    if(loan.method === 4) {
      const weeklyAmt = loan.weeklyAmount;
      if(amount !== weeklyAmt && amount !== outstanding) return { success: false, msg: `Weekly EMI must be ₹${weeklyAmt} or full balance ₹${outstanding}` };
      principalPortion = amount;
      interestPortion = 0;
    } else {
      const monthlyRate = loan.interestRate / 100;
      const loanTxns = transactions.filter(t=>t.loanId===loan.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
      let lastDate = loan.startDate ? new Date(loan.startDate) : new Date();
      if(loanTxns.length) lastDate = new Date(loanTxns[0].date);
      let currentDate = new Date(date);
      if(isNaN(currentDate)) currentDate = new Date();
      const diffDays = Math.max(1, Math.ceil((currentDate - lastDate)/(1000*60*60*24)));
      const dailyRate = monthlyRate/30;
      let interestAccrued = outstanding * dailyRate * diffDays;
      interestAccrued = parseFloat(interestAccrued.toFixed(2));
      if(loan.method === 1) { interestPortion = amount; principalPortion = 0; }
      else if(loan.method === 2) {
        if(amount <= interestAccrued) { interestPortion = amount; principalPortion = 0; }
        else { interestPortion = interestAccrued; principalPortion = amount - interestAccrued; if(principalPortion > outstanding) principalPortion = outstanding; }
      }
      else if(loan.method === 3) {
        const emi = loan.emiAmount;
        if(Math.abs(amount - emi) > 0.01) return { success: false, msg: `Monthly EMI must be ₹${emi}` };
        let interestDue = outstanding * monthlyRate;
        interestDue = parseFloat(interestDue.toFixed(2));
        if(amount <= interestDue) { interestPortion = amount; principalPortion = 0; }
        else { interestPortion = interestDue; principalPortion = amount - interestDue; if(principalPortion > outstanding) principalPortion = outstanding; }
      }
    }
    const newTxn = { id: Date.now()+Math.random(), loanId: loan.id, date, amount, interestPortion, principalPortion, remark: remark||"", timestamp: new Date().toISOString() };
    transactions.push(newTxn);
    cashCapital += amount;
    const newOut = recomputePrincipal(loan);
    if(newOut <= 0.01 && loan.method !== 1) loan.status = 'closed';
    await saveAllToFirestore();
    return { success: true };
  }

  async function saveAllToFirestore() {
    try {
      await db.collection(COLLECTION).doc(DOC_ID).set({ customers, loans, transactions, cashCapital, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
      localStorage.setItem('vsquar_customers', JSON.stringify(customers));
      localStorage.setItem('vsquar_loans', JSON.stringify(loans));
      localStorage.setItem('vsquar_transactions', JSON.stringify(transactions));
      localStorage.setItem('vsquar_cashCapital', cashCapital);
    } catch(e) { console.error(e); }
  }

  async function deleteTxnWithConfirm(txnId) {
    if(currentRole !== "admin") return;
    if(confirm("Delete this transaction permanently?")) {
      const idx = transactions.findIndex(t=>t.id==txnId);
      if(idx!==-1) {
        cashCapital -= transactions[idx].amount;
        transactions.splice(idx,1);
        await saveAllToFirestore();
        await loadData();
        renderTable();
      }
    }
  }

  async function editTransactionModal(txn) {
    const newAmount = prompt("New amount (₹)", txn.amount);
    if(newAmount===null) return;
    const newDate = prompt("New date (YYYY-MM-DD)", txn.date);
    if(newDate===null) return;
    const newRemark = prompt("Remark", txn.remark||"");
    const oldAmount = txn.amount;
    cashCapital -= oldAmount;
    const idx = transactions.findIndex(t=>t.id==txn.id);
    transactions.splice(idx,1);
    const result = await addTransactionToDB(txn.loanId, newDate, parseFloat(newAmount), newRemark||"");
    if(!result.success) {
      cashCapital += oldAmount;
      transactions.push(txn);
      await saveAllToFirestore();
      alert("Edit failed");
    } else {
      await saveAllToFirestore();
    }
    await loadData();
    renderTable();
  }
  function openEditModal(txn) { editTransactionModal(txn); }
  function openAddForPlanned(plannedDate) {
    const amount = prompt(`Enter payment amount for ${plannedDate} (EMI amount: ${currentLoan.method===3?currentLoan.emiAmount:currentLoan.weeklyAmount})`);
    if(amount===null) return;
    const date = prompt("Payment date (YYYY-MM-DD)", new Date().toISOString().slice(0,10));
    if(date===null) return;
    const remark = prompt("Remark (optional)");
    addTransactionToDB(currentLoanId, date, parseFloat(amount), remark||"").then(async res=>{
      if(res.success) { await loadData(); renderTable(); }
      else alert(res.msg);
    });
  }
  async function addNewPayment() {
    const amount = parseFloat(prompt("Payment amount (₹)"));
    if(isNaN(amount)) return;
    const date = prompt("Payment date (YYYY-MM-DD)", new Date().toISOString().slice(0,10));
    if(!date) return;
    const remark = prompt("Remark (optional)");
    const res = await addTransactionToDB(currentLoanId, date, amount, remark||"");
    if(res.success) { await loadData(); renderTable(); }
    else alert(res.msg);
  }

  // PDF generation (beautiful receipt style)
  async function generatePDF() {
    if(!currentLoan) return alert("No loan selected");
    const cust = getCustomer(currentLoan.customerId);
    const tableData = buildTableData(currentLoan, transactions);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    // Header: large RECEIPT
    doc.setFontSize(26);
    doc.setTextColor(0, 119, 182);
    doc.text("RECEIPT", 105, 25, { align: "center" });
    doc.setFontSize(10);
    doc.setTextColor(80,80,80);
    doc.text(`Date: ${new Date().toLocaleDateString()}`, 15, 38);
    doc.text(`Customer: ${cust?cust.name:''}`, 15, 46);
    doc.text(`Loan Amount: ₹${currentLoan.principalAmount.toFixed(2)}`, 15, 54);
    doc.text(`Start Date: ${currentLoan.startDate}`, 15, 62);
    doc.text(`Method: ${currentLoan.method==3?`Monthly EMI ₹${currentLoan.emiAmount}`:currentLoan.method==4?`Weekly EMI ₹${currentLoan.weeklyAmount} × ${currentLoan.tenure} weeks`:'Flexible/Interest'}`, 15, 70);
    const tableRows = tableData.map(r => [r.sl, r.plannedDate, r.paidDate, `₹${r.amount>0?r.amount.toFixed(2):'—'}`, `₹${r.balance.toFixed(2)}`, r.remark||'']);
    doc.autoTable({
      startY: 82,
      head: [['#', 'Planned Date', 'Paid Date', 'Amount', 'Balance', 'Remark']],
      body: tableRows,
      theme: 'striped',
      headStyles: { fillColor: [44,62,80], textColor: [255,255,255] },
      styles: { fontSize: 8, cellPadding: 2 },
      margin: { left: 10, right: 10 }
    });
    doc.setFontSize(10);
    doc.setTextColor(0,0,0);
    doc.text("Thank you for your timely payments!", 105, doc.autoTable.previous.finalY + 10, { align: "center" });
    const fileName = `Receipt_${cust?cust.name.replace(/\s/g,'_')}_${currentLoan.startDate}.pdf`;
    doc.save(fileName);
  }

  function populateLoanSelect() {
    const select = document.getElementById('loanSelect');
    select.innerHTML = '<option value="">-- Select Loan --</option>';
    loans.forEach(loan => {
      const cust = getCustomer(loan.customerId);
      const option = document.createElement('option');
      option.value = loan.id;
      option.textContent = `${cust?cust.name:'Unknown'} - ₹${loan.principalAmount} (${loan.method==1?'IntOnly':loan.method==2?'Flex':loan.method==3?'EMI':'Weekly'})`;
      if(currentLoanId == loan.id) option.selected = true;
      select.appendChild(option);
    });
    select.onchange = () => {
      currentLoanId = parseInt(select.value);
      if(currentLoanId) renderTable();
      else document.getElementById('noDataMsg').style.display = 'block';
    };
  }
  async function loadLoanDetails() { await renderTable(); }

  // Initialization
  async function init() {
    currentRole = getRoleFromUrl();
    document.getElementById('roleBadge').innerHTML = currentRole === 'admin' ? '🔐 Admin Mode (Full Control)' : '👁️ Viewer Mode (Read Only)';
    await loadData();
    if(loans.length>0 && !currentLoanId) currentLoanId = loans[0].id;
    if(currentLoanId) renderTable();
    document.getElementById('refreshBtn').onclick = async () => { await loadData(); renderTable(); };
    document.getElementById('downloadPdfBtn').onclick = generatePDF;
    document.getElementById('backBtn').onclick = () => { window.location.href = 'index.html'; };
    if(currentRole === 'admin') {
      document.getElementById('addPaymentBtn').onclick = addNewPayment;
    } else {
      document.getElementById('adminAddBtn').style.display = 'none';
    }
  }
  init();
</script>
</body>
</html>
