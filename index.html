    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('V² PWA: Registered');
                        reg.onupdatefound = () => {
                            const newWorker = reg.installing;
                            newWorker.onstatechange = () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (confirm('New version available! Reload to update?')) {
                                        newWorker.postMessage({ action: 'skipWaiting' });
                                        window.location.reload();
                                    }
                                }
                            };
                        };
                    })
                    .catch(err => console.log('V² PWA: Error', err));
            });
        }
    </script>

    <script>
        // ------------------------------------------------------------
        // FIREBASE CONFIG
        // ------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
            authDomain: "csl-calculations.firebaseapp.com",
            projectId: "csl-calculations",
            storageBucket: "csl-calculations.firebasestorage.app",
            messagingSenderId: "887219643486",
            appId: "1:887219643486:web:0cb001f2c72039a00240cf"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const COLLECTION = "VSQURE";
        const DOC_ID = "appData";

        // ------------------------------------------------------------
        // STATE
        // ------------------------------------------------------------
        let customers = [];
        let loans = [];
        let transactions = [];
        let cashCapital = 0;
        let currentRole = "";
        let isInitialLoad = true;
        let isSaving = false;
        let unsubscribe = null;

        // ------------------------------------------------------------
        // HELPERS
        // ------------------------------------------------------------
        function formatDateDMY(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        function getNextLoanNumber() {
            let maxNum = 0;
            loans.forEach(loan => {
                if (loan.loanNumber) {
                    const num = parseInt(loan.loanNumber, 10);
                    if (!isNaN(num) && num > maxNum) maxNum = num;
                }
            });
            return (maxNum + 1).toString().padStart(3, '0');
        }

        function getLoan(id) { return loans.find(l => l.id == id); }

        function getCustomer(id) { return customers.find(c => c.id == id); }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ?
                '&lt;' : '&gt;'); }

        function getPrincipalRemaining(loan) {
            const totalPrincipalRecovered = transactions
                .filter(t => t.loanId === loan.id)
                .reduce((sum, t) => sum + (t.principalPortion || 0), 0);
            return Math.max(0, loan.principalAmount - totalPrincipalRecovered);
        }

        function getAccruedInterestUpToDate(loan, asOfDate, principalBalance) {
            if (loan.method === 4) return 0;
            if (!loan.interestRate || loan.interestRate === 0) return 0;
            const pBal = (principalBalance !== undefined && principalBalance !== null) ? principalBalance :
                getPrincipalRemaining(loan);
            if (pBal <= 0) return 0;
            const dailyRate = (loan.interestRate / 100) / 30;
            let lastEventDate = loan.startDate ? new Date(loan.startDate) : new Date();
            const loanTxns = transactions.filter(t => t.loanId === loan.id).sort((a, b) => new Date(b.date) - new Date(a
            .date));
            if (loanTxns.length > 0) lastEventDate = new Date(loanTxns[0].date);
            const targetDate = new Date(asOfDate);
            if (targetDate <= lastEventDate) return 0;
            const diffDays = Math.floor((targetDate - lastEventDate) / (1000 * 60 * 60 * 24));
            if (diffDays <= 0) return 0;
            const interest = pBal * dailyRate * diffDays;
            return parseFloat(interest.toFixed(2));
        }

        function totalDisbursed() { return loans.reduce((s, l) => s + l.principalAmount, 0); }

        function totalInterest() { return transactions.reduce((s, t) => s + (t.interestPortion || 0), 0); }

        function totalPrincipalRecovered() { return transactions.reduce((s, t) => s + (t.principalPortion || 0), 0); }

        function totalOutstandingPrincipal() {
            let out = 0;
            loans.forEach(l => { if (l.status !== 'closed') out += getPrincipalRemaining(l); });
            return out;
        }

        function getTotalExpectedForLoan(loan) {
            if (loan.method == 4) return (loan.weeklyAmount || 250) * (loan.tenure || 44);
            else if (loan.method == 3) return (loan.emiAmount || 0) * (loan.tenure || 1);
            else return loan.principalAmount;
        }

        function recomputePrincipal(loan) {
            const totalExpected = getTotalExpectedForLoan(loan);
            const totalPaid = transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + t.amount, 0);
            return Math.max(0, totalExpected - totalPaid);
        }

        function computeTotalProfitAccurate() {
            let collectedInterest = transactions.reduce((sum, t) => sum + (t.interestPortion || 0), 0);
            let accruedNow = 0;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            for (const loan of loans) {
                if (loan.status === 'closed') continue;
                const principalBal = getPrincipalRemaining(loan);
                if (principalBal <= 0) continue;
                const accrued = getAccruedInterestUpToDate(loan, today.toISOString().slice(0, 10), principalBal);
                accruedNow += accrued;
            }
            return collectedInterest + accruedNow;
        }

        function generateSchedule(loan) {
            if (!loan) return [];
            const startDate = new Date(loan.startDate);
            const schedule = [];
            if (loan.method === 3) {
                for (let i = 1; i <= (loan.tenure || 1); i++) {
                    const due = new Date(startDate);
                    due.setMonth(startDate.getMonth() + i);
                    schedule.push({ planned: due.toISOString().slice(0, 10), expected: loan.emiAmount, index: i });
                }
            } else if (loan.method === 4) {
                for (let i = 1; i <= (loan.tenure || 44); i++) {
                    const due = new Date(startDate);
                    due.setDate(startDate.getDate() + (i * 7));
                    schedule.push({ planned: due.toISOString().slice(0, 10), expected: loan.weeklyAmount, index: i });
                }
            }
            return schedule;
        }

        function isInstallmentPaid(loan, plannedDate, index) {
            const loanTxns = transactions.filter(t => t.loanId === loan.id).sort((a, b) => new Date(a.date) - new Date(b
            .date));
            if (index <= loanTxns.length) {
                const txnDate = loanTxns[index - 1].date;
                const diffDays = Math.abs(new Date(txnDate) - new Date(plannedDate)) / (1000 * 60 * 60 * 24);
                return diffDays <= 7;
            }
            return false;
        }

        function getNextDueAlert(loan) {
            if (loan.method !== 3 && loan.method !== 4) return null;
            if (loan.status === 'closed') return null;
            const schedule = generateSchedule(loan);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            for (let i = 0; i < schedule.length; i++) {
                const inst = schedule[i];
                const dueDate = new Date(inst.planned);
                if (dueDate < today) continue;
                if (isInstallmentPaid(loan, inst.planned, i + 1)) continue;
                const diffDays = Math.floor((dueDate - today) / (1000 * 60 * 60 * 24));
                if (diffDays <= 3) {
                    return {
                        customer: getCustomer(loan.customerId)?.name || "Unknown",
                        dueDate: inst.planned,
                        dueDateStr: formatDateDMY(inst.planned),
                        isOverdue: dueDate < today,
                        methodText: loan.method === 4 ? `Weekly ₹${loan.weeklyAmount}` : `EMI ₹${loan.emiAmount}`,
                        installmentNum: i + 1,
                        loanNumber: loan.loanNumber
                    };
                }
            }
            return null;
        }

        // ------------------------------------------------------------
        // FIREBASE DATA LAYER
        // ------------------------------------------------------------
        function loadData() {
            if (unsubscribe) unsubscribe();
            unsubscribe = db.collection(COLLECTION).doc(DOC_ID).onSnapshot(
                (doc) => {
                    if (doc.exists) {
                        const d = doc.data();
                        customers = d.customers || [];
                        loans = d.loans || [];
                        transactions = d.transactions || [];
                        cashCapital = d.cashCapital || 0;
                        assignMissingLoanNumbersSync();
                        renderAll();
                        document.getElementById('syncStatus').innerHTML = "☁️ Active";
                        document.getElementById('loadingOverlay').classList.add('hidden');
                        isInitialLoad = false;
                    } else {
                        const initialData = { customers: [], loans: [], transactions: [], cashCapital: 0 };
                        db.collection(COLLECTION).doc(DOC_ID).set(initialData)
                            .then(() => {})
                            .catch(err => {
                                console.error("Failed to create document:", err);
                                document.getElementById('syncStatus').innerHTML = "❌ Init Error";
                            });
                    }
                },
                (error) => {
                    console.error("Firestore snapshot error:", error);
                    document.getElementById('syncStatus').innerHTML = "❌ Sync Error";
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }
            );
        }

        function assignMissingLoanNumbersSync() {
            const loansWithoutNumber = loans.filter(l => !l.loanNumber);
            if (loansWithoutNumber.length === 0) return;
            loansWithoutNumber.sort((a, b) => a.id - b.id);
            let maxNum = 0;
            loans.forEach(loan => {
                if (loan.loanNumber) {
                    const num = parseInt(loan.loanNumber, 10);
                    if (!isNaN(num) && num > maxNum) maxNum = num;
                }
            });
            let currentNumber = maxNum + 1;
            for (const loan of loansWithoutNumber) {
                loan.loanNumber = currentNumber.toString().padStart(3, '0');
                currentNumber++;
            }
            saveAll();
        }

        async function saveAll() {
            if (currentRole !== "admin") return;
            if (isSaving) return;
            isSaving = true;
            try {
                document.getElementById('syncStatus').innerHTML = "🔄 Syncing...";
                await db.collection(COLLECTION).doc(DOC_ID).set({
                    customers,
                    loans,
                    transactions,
                    cashCapital,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                document.getElementById('syncStatus').innerHTML = "✅ Synced";
                setTimeout(() => {
                    if (document.getElementById('syncStatus').innerHTML === "✅ Synced") {
                        document.getElementById('syncStatus').innerHTML = "☁️ Active";
                    }
                }, 2000);
            } catch (e) {
                console.error("Save error:", e);
                document.getElementById('syncStatus').innerHTML = "❌ Save Error";
                alert("Error saving data! Please check your network and try again.");
            } finally {
                isSaving = false;
            }
        }

        // ------------------------------------------------------------
        // CONFIRMATION POPUP
        // ------------------------------------------------------------
        function showConfirmDialog(message, onConfirm, onCancel) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <h3>⚠️ Confirm</h3>
                    <p style="margin:15px 0;">${message}</p>
                    <div class="flex-btns">
                        <button id="confirmOkBtn" style="background:#dc3545;">Yes, Delete</button>
                        <button id="confirmCancelBtn" style="background:#6c757d;">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('#confirmOkBtn').onclick = () => { modalDiv.remove();
                onConfirm(); };
            modalDiv.querySelector('#confirmCancelBtn').onclick = () => { modalDiv.remove(); if (onCancel) onCancel(); };
        }

        // ------------------------------------------------------------
        // BUSINESS OPERATIONS
        // ------------------------------------------------------------
        function addTransaction(loanId, date, amount, remark) {
            if (currentRole !== "admin") return { success: false, msg: "Viewer cannot add" };
            const loan = getLoan(loanId);
            if (!loan) return { success: false, msg: "Loan not found" };
            if (loan.status === 'closed') return { success: false, msg: "Loan already closed" };
            if (amount <= 0) return { success: false, msg: "Amount must be positive" };

            let interestPortion = 0,
                principalPortion = 0;
            let outstandingPrincipal = getPrincipalRemaining(loan);

            if (loan.method === 2) {
                const loanTxns = transactions.filter(t => t.loanId === loan.id).sort((a, b) => new Date(b.date) - new Date(
                    a.date));
                let lastDate = loan.startDate ? new Date(loan.startDate) : new Date();
                if (loanTxns.length > 0) lastDate = new Date(loanTxns[0].date);
                let currentDate = new Date(date);
                if (isNaN(currentDate)) currentDate = new Date();
                const diffDays = Math.max(0, Math.floor((currentDate - lastDate) / (1000 * 60 * 60 * 24)));
                const monthlyRate = loan.interestRate / 100;
                const dailyRate = monthlyRate / 30;
                let interestAccrued = outstandingPrincipal * dailyRate * diffDays;
                interestAccrued = parseFloat(interestAccrued.toFixed(2));
                if (amount <= interestAccrued) { interestPortion = amount;
                    principalPortion = 0; } else { interestPortion = interestAccrued;
                    principalPortion = amount - interestAccrued; if (principalPortion > outstandingPrincipal)
                        principalPortion = outstandingPrincipal; }
            } else if (loan.method === 1) {
                interestPortion = amount;
                principalPortion = 0;
            } else if (loan.method === 3) {
                const monthlyRate = loan.interestRate / 100;
                let interestDue = outstandingPrincipal * monthlyRate;
                interestDue = parseFloat(interestDue.toFixed(2));
                interestPortion = Math.min(amount, interestDue);
                principalPortion = amount - interestPortion;
                if (principalPortion > outstandingPrincipal) principalPortion = outstandingPrincipal;
            } else if (loan.method === 4) {
                if (amount <= outstandingPrincipal) { principalPortion = amount;
                    interestPortion = 0; } else { principalPortion = outstandingPrincipal;
                    interestPortion = amount - outstandingPrincipal; }
            }

            const newTxn = {
                id: Date.now() + Math.random(),
                loanId: loan.id,
                date,
                amount,
                interestPortion,
                principalPortion,
                remark: remark || "",
                timestamp: new Date().toISOString()
            };
            transactions.push(newTxn);
            cashCapital += amount;

            const totalPaidPrincipal = transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + (t
                .principalPortion || 0), 0);
            if (totalPaidPrincipal >= loan.principalAmount - 0.01) loan.status = 'closed';
            else loan.status = 'active';

            saveAll();
            return { success: true, msg: "Payment added!", txn: newTxn };
        }

        function createLoan(custId, amount, rate, method, startDate, tenure, weeklyAmount) {
            if (currentRole !== "admin") return false;
            if (amount > cashCapital) return false;
            let emi = null,
                weeklyAmt = null;
            if (method === 3) {
                const r = rate / 100;
                emi = amount * r * Math.pow(1 + r, tenure) / (Math.pow(1 + r, tenure) - 1);
                emi = Math.round(emi);
            } else if (method === 4) { weeklyAmt = weeklyAmount; if (!weeklyAmt || weeklyAmt <= 0) return false; }
            const newLoanNumber = getNextLoanNumber();
            const newLoan = {
                id: Date.now(),
                customerId: custId,
                principalAmount: amount,
                interestRate: rate,
                method,
                status: 'active',
                startDate,
                emiAmount: emi,
                tenure: tenure || null,
                weeklyAmount: weeklyAmt,
                loanNumber: newLoanNumber
            };
            loans.push(newLoan);
            cashCapital -= amount;
            saveAll();
            return true;
        }

        function closeLoanWithAccrued(loanId, closeDate, totalDue, principalPortionVal, interestPortionVal) {
            if (currentRole !== "admin") return false;
            const loan = getLoan(loanId);
            if (!loan || loan.status === 'closed') return false;
            if (totalDue <= 0) return false;
            const newTxn = {
                id: Date.now() + Math.random(),
                loanId: loan.id,
                date: closeDate,
                amount: totalDue,
                interestPortion: interestPortionVal,
                principalPortion: principalPortionVal,
                remark: "Loan closure (full settlement)",
                timestamp: new Date().toISOString()
            };
            transactions.push(newTxn);
            cashCapital += totalDue;
            loan.status = 'closed';
            saveAll();
            return true;
        }

        function deleteTransaction(txnId) {
            if (currentRole !== "admin") return false;
            const txn = transactions.find(t => t.id == txnId);
            if (!txn) return false;
            showConfirmDialog("Delete this transaction permanently?", () => {
                const idx = transactions.findIndex(t => t.id == txnId);
                if (idx !== -1) {
                    cashCapital -= transactions[idx].amount;
                    transactions.splice(idx, 1);
                    loans.forEach(l => {
                        const totalPaidPrincipal = transactions.filter(t => t.loanId == l.id).reduce((sum, t) =>
                            sum + (t.principalPortion || 0), 0);
                        if (totalPaidPrincipal >= l.principalAmount) l.status = 'closed';
                        else l.status = 'active';
                    });
                    saveAll();
                    renderAll();
                }
            });
            return true;
        }

        function editTransaction(txnId, newAmount, newDate, newRemark) {
            if (currentRole !== "admin") return false;
            const txn = transactions.find(t => t.id == txnId);
            if (!txn) return false;
            cashCapital -= txn.amount;
            const idx = transactions.findIndex(t => t.id == txnId);
            transactions.splice(idx, 1);
            const result = addTransaction(txn.loanId, newDate, newAmount, newRemark);
            if (!result.success) {
                cashCapital += txn.amount;
                transactions.push(txn);
                saveAll();
                return false;
            }
            saveAll();
            return true;
        }

        // ------------------------------------------------------------
        // RENDER FUNCTIONS
        // ------------------------------------------------------------
        function renderCustomers() {
            const container = document.getElementById('customerList');
            if (!container) return;
            container.innerHTML = customers.length ? customers.map(c =>
                `<div class="list-item"><div class="flex-row"><strong>${escapeHtml(c.name)}</strong><span class="badge">${c.phone||''}</span></div><div class="text-muted">${escapeHtml(c.address||'')}</div></div>`
            ).join('') : '<div class="text-muted">No customers</div>';
            const dropdownHtml = '<option value="">-- select customer --</option>' + customers.map(c =>
                `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
            const loanCust = document.getElementById('loanCustomerId');
            if (loanCust && currentRole === "admin") loanCust.innerHTML = dropdownHtml;
        }

        function renderLoans() {
            const container = document.getElementById('loanList');
            if (!container) return;
            if (loans.length === 0) { container.innerHTML = '<div class="text-muted">No loans</div>'; return; }
            const sortedLoans = [...loans].sort((a, b) => {
                if (a.status === 'closed' && b.status !== 'closed') return 1;
                if (a.status !== 'closed' && b.status === 'closed') return -1;
                return 0;
            });
            container.innerHTML = sortedLoans.map(loan => {
                const cust = getCustomer(loan.customerId);
                const principalBal = getPrincipalRemaining(loan);
                const totalExpectedRemaining = recomputePrincipal(loan);
                let methodDesc = '';
                if (loan.method === 1) methodDesc = 'Interest only';
                else if (loan.method === 2) methodDesc = 'Flexible';
                else if (loan.method === 3) methodDesc = `Monthly EMI ₹${loan.emiAmount}`;
                else methodDesc = `Weekly EMI ₹${loan.weeklyAmount} × ${loan.tenure} weeks`;
                const closedBadge = loan.status === 'closed' ? ' | ✅ CLOSED' : '';
                const expectedLine = (loan.method === 3 || loan.method === 4) ?
                    `<div>📊 Expected Remaining: ₹${totalExpectedRemaining.toFixed(2)}</div>` : '';
                return `<div class="list-item" data-loan-id="${loan.id}">
                        <div class="flex-row"><strong>${cust?cust.name:'Unknown'} (Loan #${loan.loanNumber})</strong><span class="badge">Amount: ₹${loan.principalAmount}</span></div>
                        <div>Rate: ${loan.interestRate}% | Start: ${formatDateDMY(loan.startDate)} | ${methodDesc}</div>
                        <div>📌 Principal Balance: ₹${principalBal.toFixed(2)}</div>
                        ${expectedLine}
                        <div>Status: ${loan.status==='closed'?'Closed':'Active'}${closedBadge}</div>
                        ${loan.status !== 'closed' ? `<div><button class="small-btn close-loan" data-id="${loan.id}">🔒 Close Loan</button></div>` : ''}
                    </div>`;
            }).join('');
            document.querySelectorAll('.close-loan').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    showCloseLoanModal(id);
                });
            });
            const txnLoan = document.getElementById('txnLoanId');
            if (txnLoan && currentRole === "admin") {
                txnLoan.innerHTML = '<option value="">-- select loan --</option>' + loans.map(l => {
                    const cust = getCustomer(l.customerId);
                    return `<option value="${l.id}">#${l.loanNumber} - ${cust?cust.name:'N/A'} (₹${l.principalAmount})</option>`;
                }).join('');
            }
        }

        function renderTransactions() {
            const container = document.getElementById('transactionList');
            if (!container) return;
            if (transactions.length === 0) { container.innerHTML = '<div class="text-muted">No transactions</div>'; return; }
            container.innerHTML = transactions.sort((a, b) => new Date(b.date) - new Date(a.date)).map(txn => {
                const loan = getLoan(txn.loanId);
                const cust = loan ? getCustomer(loan.customerId) : null;
                let actionBtns = currentRole === "admin" ?
                    `<div><button class="small-btn edit-txn" data-id="${txn.id}">Edit</button><button class="small-btn delete-txn" data-id="${txn.id}">Delete</button></div>` :
                    '';
                return `<div class="list-item"><div class="flex-row"><strong>${cust?cust.name:'Unknown'} (Loan #${loan?.loanNumber || '?'})</strong><span class="badge">${formatDateDMY(txn.date)}</span></div><div>Amount: ₹${txn.amount} | Interest: ₹${txn.interestPortion} | Principal: ₹${txn.principalPortion}</div><div>Remark: ${escapeHtml(txn.remark||'')}</div>${actionBtns}</div>`;
            }).join('');
            if (currentRole === "admin") {
                document.querySelectorAll('.edit-txn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.getAttribute('data-id'));
                        const txn = transactions.find(t => t.id === id);
                        if (txn) {
                            const newAmt = prompt("New amount", txn.amount);
                            if (newAmt !== null) {
                                const newDate = prompt("New date (YYYY-MM-DD)", txn.date);
                                if (newDate !== null) {
                                    const newRemark = prompt("Remark", txn.remark || '');
                                    if (newRemark !== null) {
                                        if (editTransaction(id, parseFloat(newAmt), newDate, newRemark)) { renderAll();
                                            alert("Transaction updated!"); } else alert("Edit failed");
                                    }
                                }
                            }
                        }
                    });
                });
                document.querySelectorAll('.delete-txn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.getAttribute('data-id'));
                        deleteTransaction(id);
                    });
                });
            }
        }

        function renderDashboard() {
            document.getElementById('dashCustomers').innerText = customers.length;
            document.getElementById('dashActiveLoans').innerText = loans.filter(l => l.status !== 'closed').length;
            const outstandingPrincipal = totalOutstandingPrincipal();
            const invested = totalDisbursed();
            const totalProfitAccurate = computeTotalProfitAccurate();
            const profitEarnedRealised = totalInterest();
            const profitPercentAccurate = invested > 0 ? (totalProfitAccurate / invested * 100).toFixed(2) : '0.00';
            document.getElementById('dashboardOutput').innerHTML = `
                <p><strong>💰 Cash on Hand:</strong> <span>₹${cashCapital.toFixed(2)}</span></p>
                <p><strong>📊 Total Outstanding Principal:</strong> <span>₹${outstandingPrincipal.toFixed(2)}</span></p>
                <p><strong>📈 Approx Profit (incl. accrued):</strong> <span class="profit-green">₹${totalProfitAccurate.toFixed(2)} <span style="font-size:0.75rem;">(+${profitPercentAccurate}%)</span></span></p>
                <p><strong>✅ Total Profit Earned:</strong> <span class="profit-green">₹${profitEarnedRealised.toFixed(2)}</span></p>
                <p><strong>👥 Partner's Share (50%):</strong> <span>₹${(profitEarnedRealised/2).toFixed(2)}</span></p>
            `;
            const alerts = [];
            loans.forEach(loan => {
                if (loan.status === 'closed') return;
                const alertInfo = getNextDueAlert(loan);
                if (alertInfo) alerts.push(alertInfo);
            });
            alerts.sort((a, b) => {
                if (a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });
            const container = document.getElementById('dueAlertsContainer');
            if (container) {
                container.innerHTML = alerts.length ? alerts.map(a =>
                    `<div class="due-card ${a.isOverdue ? 'overdue' : ''}"><span class="due-customer-name">${a.customer}</span> | Loan #${a.loanNumber} | Due: ${a.dueDateStr} | ${a.methodText} (Inst.${a.installmentNum}) ${a.isOverdue ? '⚠️ OVERDUE' : ''}</div>`
                ).join('') : '<div class="text-muted">No pending dues</div>';
            }
        }

        function renderAll() {
            renderCustomers();
            renderLoans();
            renderTransactions();
            renderDashboard();

            if (currentRole === "viewer") {
                document.querySelectorAll('#mainApp input, #mainApp select, #mainApp textarea, #mainApp button').forEach(
                el => {
                    if (!el.classList.contains('tab') && el.id !== 'transactionManagerBtn' && el.id !==
                        'moreDetailsBtn') el.disabled = true;
                });
            } else {
                document.querySelectorAll('#mainApp input, #mainApp select, #mainApp textarea, #mainApp button')
                    .forEach(el => el.disabled = false);
            }
        }

        // ------------------------------------------------------------
        // MODALS
        // ------------------------------------------------------------
        function showCloseLoanModal(loanId) {
            const loan = getLoan(loanId);
            if (!loan) return;
            if (loan.status === 'closed') { alert("Loan already closed"); return; }
            const principalBal = getPrincipalRemaining(loan);
            if (principalBal <= 0.01) {
                loan.status = 'closed';
                saveAll();
                renderAll();
                alert("Loan already fully paid. Marked as closed.");
                return;
            }
            const today = new Date().toISOString().slice(0, 10);
            const accruedInterest = getAccruedInterestUpToDate(loan, today, principalBal);
            const totalDue = principalBal + accruedInterest;
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <h3>Close Loan #${loan.loanNumber}</h3>
                    <p><strong>Principal Balance:</strong> ₹${principalBal.toFixed(2)}</p>
                    <p><strong>Accrued Interest:</strong> ₹${accruedInterest.toFixed(2)}</p>
                    <p><strong>Total Due:</strong> ₹${totalDue.toFixed(2)}</p>
                    <label>Closing Date</label>
                    <input type="date" id="closeDate" value="${today}">
                    <div class="flex-btns">
                        <button id="closeConfirmBtn" style="background:#2a9d8f;">Confirm Close</button>
                        <button id="closeCancelBtn" style="background:#6c757d;">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('#closeConfirmBtn').onclick = () => {
                const closeDate = modalDiv.querySelector('#closeDate').value;
                if (!closeDate) { alert("Select date"); return; }
                const result = closeLoanWithAccrued(loanId, closeDate, totalDue, principalBal, accruedInterest);
                if (result) { renderAll();
                    alert(`Loan #${loan.loanNumber} closed!`);
                    modalDiv.remove(); } else alert("Failed to close loan");
            };
            modalDiv.querySelector('#closeCancelBtn').onclick = () => modalDiv.remove();
        }

        // ------------------------------------------------------------
        // INIT EVENTS
        // ------------------------------------------------------------
        function initEvents() {
            document.getElementById('transactionManagerBtn')?.addEventListener('click', () => {
                window.location.href = `transations.html?role=${currentRole}`;
            });
            document.getElementById('moreDetailsBtn')?.addEventListener('click', () => {
                window.location.href = 'details.html';
            });

            document.getElementById('addCustomerBtn')?.addEventListener('click', () => {
                if (currentRole !== "admin") return;
                const name = document.getElementById('custName').value.trim();
                if (!name) return alert("Name required");
                customers.push({ id: Date.now(), name, phone: document.getElementById('custPhone').value.trim(),
                    address: document.getElementById('custAddress').value.trim().slice(0, 150) });
                saveAll();
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custAddress').value = '';
            });

            document.getElementById('createLoanBtn')?.addEventListener('click', () => {
                if (currentRole !== "admin") return;
                const custId = parseInt(document.getElementById('loanCustomerId').value);
                if (!custId) return alert("Select customer");
                const startDate = document.getElementById('loanStartDate').value;
                if (!startDate) return alert("Start date");
                const amount = parseFloat(document.getElementById('loanAmount').value);
                const rate = parseFloat(document.getElementById('loanInterest').value);
                const method = parseInt(document.getElementById('loanMethod').value);
                if (isNaN(amount) || amount <= 0) return alert("Valid amount");
                if (method !== 4 && (isNaN(rate) || rate < 0)) return alert("Rate required");
                if (amount > cashCapital) return alert(`Insufficient cash. Available: ₹${cashCapital}`);
                let tenure = null,
                    weeklyAmt = null;
                if (method === 3 || method === 4) {
                    tenure = parseInt(document.getElementById('loanTenure').value);
                    if (!tenure) return alert(`Enter ${method === 3 ? 'months' : 'weeks'}`);
                    if (method === 4) { weeklyAmt = parseFloat(document.getElementById('weeklyInstallment').value); if (
                            !weeklyAmt) return alert("Weekly amount"); }
                }
                if (createLoan(custId, amount, rate, method, startDate, tenure, weeklyAmt)) {
                    document.getElementById('loanAmount').value = '';
                    alert("Loan created!");
                } else alert("Creation failed");
            });

            document.getElementById('addTransactionBtn')?.addEventListener('click', () => {
                if (currentRole !== "admin") return;
                const loanId = parseInt(document.getElementById('txnLoanId').value);
                if (!loanId) return alert("Select loan");
                const date = document.getElementById('txnDate').value || new Date().toISOString().slice(0, 10);
                const amount = parseFloat(document.getElementById('txnAmount').value);
                if (isNaN(amount) || amount <= 0) return alert("Valid amount");
                const res = addTransaction(loanId, date, amount, document.getElementById('txnRemark').value);
                if (res.success) { document.getElementById('txnAmount').value = '';
                    document.getElementById('txnRemark').value = '';
                    alert("Payment added!"); } else alert(res.msg);
            });

            document.getElementById('loanMethod')?.addEventListener('change', (e) => {
                const method = parseInt(e.target.value);
                const emiDiv = document.getElementById('emiFields');
                const weeklyField = document.getElementById('weeklyAmountField');
                const tenureLabel = document.getElementById('tenureLabel');
                if (method === 3) { emiDiv.style.display = 'block';
                    weeklyField.style.display = 'none';
                    tenureLabel.innerText = 'Tenure (months)'; } else if (method === 4) { emiDiv.style.display =
                        'block';
                    weeklyField.style.display = 'block';
                    tenureLabel.innerText = 'Number of weeks'; } else emiDiv.style.display = 'none';
            });

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
                });
            });
        }

        // ------------------------------------------------------------
        // PASSWORD / UNLOCK
        // ------------------------------------------------------------
        async function unlockApp() {
            const pwd = document.getElementById('passwordInput').value;
            if (pwd === '2') { currentRole = "admin";
                await proceed(); } else if (pwd === '4250') { currentRole = "viewer";
                await proceed(); } else {
                document.getElementById('pwdError').innerText = 'Wrong password';
            }
        }

        async function proceed() {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('loadingOverlay').classList.remove('hidden');
            loadData();
            initEvents();
            document.getElementById('emiFields').style.display = 'none';
            document.getElementById('loanStartDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('txnDate').value = new Date().toISOString().slice(0, 10);
        }

        document.getElementById('unlockBtn')?.addEventListener('click', unlockApp);
        document.getElementById('passwordInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') unlockApp(); });
    </script>
</body>
</html>
