<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Vsquar · Loan Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            console.log('Vsquar PWA: Registered');
            reg.onupdatefound = () => {
              const newWorker = reg.installing;
              newWorker.onstatechange = () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  if (confirm('New version available! Reload to update?')) {
                    newWorker.postMessage({ action: 'skipWaiting' });
                    window.location.reload();
                  }
                }
              };
            };
          })
          .catch(err => console.log('Vsquar PWA: Error', err));
      });
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; color: #333; }
    .container { max-width: 100%; width: 85%; margin: 20px auto; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }
    h1 { text-align: center; color: #0077b6; font-size: 1.7em; margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85em; }
    input, select, textarea { width: 40%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.85em; }
    textarea { resize: vertical; font-family: inherit; }
    .output { background: #e0f7fa; padding: 12px 16px; margin-top: 15px; border-radius: 8px; font-size: 0.85em; text-align: left; }
    .output p { margin: 0 0 12px 0; line-height: 1.4; }
    .output p:last-child { margin-bottom: 0; }
    .output span { font-weight: bold; }
    .profit-green, .profit-green span { color: #2e7d32 !important; font-weight: bold; }
    button { margin-top: 15px; padding: 10px; border: none; border-radius: 8px; background: #00b4d8; color: #fff; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85em; }
    button.small-btn { width: auto; padding: 5px 12px; margin: 0 4px; display: inline-block; font-size: 0.7em; }
    button.danger { background: #dc3545; }
    button.warning { background: #f4a261; }
    .more-details-btn, .transaction-manager-btn { background: #2a9d8f; margin-top: 8px; margin-bottom: 8px; }
    .footer { text-align: center; margin-top: 20px; background: #0077b6; color: #fff; padding: 10px; font-size: 0.75em; border-radius: 8px; position: relative; }
    .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
    .tab { cursor: pointer; padding: 7px 14px; background: #0077b6; color: white; border-radius: 8px; font-size: 0.85em; flex: 1; text-align: center; margin: 0 2px; }
    .tab.active { background: #00b4d8; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .stats-row { display: flex; justify-content: space-between; background: #e0f7fa; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.8em; gap: 10px; flex-wrap: wrap; }
    .stat-item { text-align: center; flex: 1; }
    .list-item { background: #f8fafc; border-radius: 12px; padding: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; font-size: 0.8em; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .badge { background: #90e0ef; padding: 2px 8px; border-radius: 20px; font-size: 0.7em; }
    .text-muted { color: #666; font-size: 0.7em; }
    hr { margin: 10px 0; }
    .due-card { background: #fff3e0; border-left: 4px solid #f4a261; padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; font-size: 0.8em; }
    .due-card.overdue { background: #ffe0e0; border-left-color: #dc3545; }
    .due-card.overdue .due-customer-name { color: #dc3545; font-weight: bold; }
    .capital-history { max-height: 250px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px; }
    .capital-entry { background: #f1f9fe; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 0.75em; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .countdown-modal .modal-content { text-align: center; }
    .countdown-timer { font-size: 2rem; font-weight: bold; color: #dc3545; margin: 15px 0; }
    @media (max-width: 600px) {
      .container { width: 90%; padding: 10px; }
      input, select, textarea { width: 100%; }
      .tab { padding: 5px 9px; font-size: 0.75em; }
      button { padding: 8px; }
      .output p { margin-bottom: 10px; }
    }
    .password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .password-card { background: white; border-radius: 20px; padding: 20px; width: 80%; max-width: 280px; text-align: center; }
    .password-card input { width: 100%; margin: 10px 0; }
    .error-msg { color: red; font-size: 0.75em; }
    .sync-status-bottom { font-size: 0.65em; text-align: center; margin-top: 8px; color: #e0f7fa; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background: white; border-radius: 24px; padding: 25px; width: 90%; max-width: 400px; }
    .modal-content input, .modal-content select { width: 100%; margin: 10px 0; padding: 10px; border-radius: 12px; border:1px solid #ccc; }
    .flex-btns { display: flex; gap: 12px; margin-top: 15px; justify-content: flex-end; }
  </style>
</head>
<body>
<div id="passwordModal" class="password-overlay">
  <div class="password-card">
    <h2>🔐 Vsquar Access</h2>
    <p>Enter password</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <button id="unlockBtn">Unlock</button>
    <div id="pwdError" class="error-msg"></div>
  </div>
</div>
<div id="fakeTimeDisplay" style="display:none; text-align:center; margin-top:50px; font-size:2em;"></div>

<div id="mainApp" style="display:none">
  <div class="container">
    <h1>Vsquar</h1>
    <div class="tabs">
      <div class="tab active" data-tab="dashboard">Dashboard</div>
      <div class="tab" data-tab="customers">Customers</div>
      <div class="tab" data-tab="loans">Loans</div>
      <div class="tab" data-tab="transactions">Transactions</div>
      <div class="tab" data-tab="capital">Capital</div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="tab-content active">
      <div class="output" id="dashboardOutput"></div>
      <div class="stats-row">
        <div class="stat-item">👥 Customers: <span id="dashCustomers">0</span></div>
        <div class="stat-item">🏦 Active Loans: <span id="dashActiveLoans">0</span></div>
      </div>
      <button id="transactionManagerBtn" class="transaction-manager-btn" style="background:#2a9d8f;">📋 Detailed Transaction Manager</button>
      <button id="moreDetailsBtn" class="more-details-btn" style="background:#6c757d;">ℹ️ More Details</button>
      <div style="margin-top:20px"><strong>📅 Due Alerts</strong><div id="dueAlertsContainer"></div></div>
    </div>

    <!-- Customers -->
    <div id="customers" class="tab-content">
      <label>Name</label><input type="text" id="custName" placeholder="Full name">
      <label>Phone</label><input type="text" id="custPhone" placeholder="Phone">
      <label>Address (max 150 chars)</label>
      <textarea id="custAddress" rows="2" maxlength="150" placeholder="Address, landmark, etc."></textarea>
      <button id="addCustomerBtn">Add Customer</button>
      <div id="customerList"></div>
    </div>

    <!-- Loans -->
    <div id="loans" class="tab-content">
      <label>Customer</label><select id="loanCustomerId"></select>
      <label>Start Date</label><input type="date" id="loanStartDate">
      <label>Loan Amount (₹)</label><input type="number" id="loanAmount" placeholder="Amount">
      <label>Monthly Interest Rate (%)</label><input type="number" id="loanInterest" step="any" placeholder="e.g., 2.5 (not for weekly EMI)">
      <label>Method</label>
      <select id="loanMethod">
        <option value="1">Monthly Interest Only</option>
        <option value="2">Flexible (Interest first)</option>
        <option value="3">Monthly EMI</option>
        <option value="4">Weekly EMI (Fixed amount, no interest)</option>
      </select>
      <div id="emiFields" style="display:none; margin-top:10px">
        <label id="tenureLabel">Tenure (months)</label>
        <input type="number" id="loanTenure" placeholder="Number">
        <div id="weeklyAmountField" style="display:none; margin-top:10px">
          <label>Weekly Installment Amount (₹)</label>
          <input type="number" id="weeklyInstallment" placeholder="Fixed weekly payment">
        </div>
      </div>
      <button id="createLoanBtn">Create Loan</button>
      <div id="loanList"></div>
    </div>

    <!-- Transactions -->
    <div id="transactions" class="tab-content">
      <label>Select Loan</label><select id="txnLoanId"></select>
      <label>Date</label><input type="date" id="txnDate">
      <label>Amount (₹)</label><input type="number" id="txnAmount" placeholder="Amount">
      <label>Remark</label><input type="text" id="txnRemark" placeholder="Optional note">
      <button id="addTransactionBtn">Add Payment</button>
      <div id="transactionList"></div>
    </div>

    <!-- Capital Tab -->
    <div id="capital" class="tab-content">
      <div class="output" id="capitalOutput" style="text-align:left"></div>
      <hr>
      <div style="background:#e9ecef; padding:12px; border-radius:12px;">
        <div><strong>➕ Add Capital (Invest)</strong></div>
        <input type="number" id="addCapitalInput" placeholder="Amount to add">
        <button id="addCapitalBtn">Add Capital</button>
      </div>
      <div style="background:#e9ecef; padding:12px; border-radius:12px; margin-top:10px;">
        <div><strong>🏦 Withdraw Capital</strong></div>
        <input type="number" id="withdrawAmountSettings" placeholder="Amount to withdraw">
        <button id="withdrawCapitalSettingsBtn">Withdraw</button>
      </div>
      <div><strong>📜 Capital Transaction History</strong></div>
      <div id="capitalHistoryList" class="capital-history"></div>
    </div>

    <div class="footer">
      Vsquar · Equal Partners · Cloud Sync
      <div id="syncStatus" class="sync-status-bottom">🔄 Syncing...</div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
    authDomain: "csl-calculations.firebaseapp.com",
    projectId: "csl-calculations",
    storageBucket: "csl-calculations.firebasestorage.app",
    messagingSenderId: "887219643486",
    appId: "1:887219643486:web:0cb001f2c72039a00240cf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "VSQURE";
  const DOC_ID = "appData";

  let customers = [], loans = [], transactions = [], cashCapital = 0, currentRole = "";
  let capitalHistory = [];

  function formatDateDMY(dateStr) {
    if (!dateStr) return '';
    let parts = dateStr.split('-');
    if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
    return dateStr;
  }

  async function syncToFirebase() {
    if (currentRole !== "admin") return;
    try {
      await db.collection(COLLECTION).doc(DOC_ID).set({ customers, loans, transactions, cashCapital, capitalHistory, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
      document.getElementById('syncStatus').innerHTML = "✅ Synced";
      setTimeout(() => document.getElementById('syncStatus').innerHTML = "☁️ Active", 2000);
    } catch(e) { console.error(e); }
  }
  async function loadData() {
    try {
      const doc = await db.collection(COLLECTION).doc(DOC_ID).get();
      if(doc.exists) {
        const d = doc.data();
        customers = d.customers || []; loans = d.loans || []; transactions = d.transactions || []; cashCapital = d.cashCapital || 0;
        capitalHistory = d.capitalHistory || [];
        localStorage.setItem('vsquar_customers', JSON.stringify(customers));
        localStorage.setItem('vsquar_loans', JSON.stringify(loans));
        localStorage.setItem('vsquar_transactions', JSON.stringify(transactions));
        localStorage.setItem('vsquar_cashCapital', cashCapital);
        localStorage.setItem('vsquar_capitalHistory', JSON.stringify(capitalHistory));
      } else loadLocalBackup();
    } catch(e) { loadLocalBackup(); }
  }
  function loadLocalBackup() {
    customers = JSON.parse(localStorage.getItem('vsquar_customers')||'[]');
    loans = JSON.parse(localStorage.getItem('vsquar_loans')||'[]');
    transactions = JSON.parse(localStorage.getItem('vsquar_transactions')||'[]');
    cashCapital = parseFloat(localStorage.getItem('vsquar_cashCapital')||0);
    capitalHistory = JSON.parse(localStorage.getItem('vsquar_capitalHistory')||'[]');
  }
  function saveAll() {
    if(currentRole !== "admin") return;
    localStorage.setItem('vsquar_customers', JSON.stringify(customers));
    localStorage.setItem('vsquar_loans', JSON.stringify(loans));
    localStorage.setItem('vsquar_transactions', JSON.stringify(transactions));
    localStorage.setItem('vsquar_cashCapital', cashCapital);
    localStorage.setItem('vsquar_capitalHistory', JSON.stringify(capitalHistory));
    syncToFirebase();
  }

  function addCapitalHistory(type, amount, dateStr) {
    if(currentRole !== "admin") return;
    capitalHistory.unshift({ id: Date.now()+Math.random(), type, amount, date: dateStr, timestamp: new Date().toISOString() });
    if(capitalHistory.length > 100) capitalHistory.pop();
    saveAll();
  }

  function getLoan(id) { return loans.find(l=>l.id==id); }
  function getCustomer(id) { return customers.find(c=>c.id==id); }

  function getTotalExpectedForLoan(loan) {
    if(loan.method == 4) return (loan.weeklyAmount || 250) * (loan.tenure || 44);
    else if(loan.method == 3) return (loan.emiAmount || 0) * (loan.tenure || 1);
    else return loan.principalAmount;
  }

  function recomputePrincipal(loan) {
    const totalExpected = getTotalExpectedForLoan(loan);
    const totalPaid = transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + t.amount, 0);
    return Math.max(0, totalExpected - totalPaid);
  }

  function totalInterest() { return transactions.reduce((s,t)=>s+(t.interestPortion||0),0); }
  function totalPrincipalRecovered() { return transactions.reduce((s,t)=>s+(t.principalPortion||0),0); }
  function totalDisbursed() { return loans.reduce((s,l)=>s+l.principalAmount,0); }
  function totalOutstanding() { let out=0; loans.forEach(l=>out+=recomputePrincipal(l)); return out; }

  function computeApproxProfit() {
    let total = 0;
    const today = new Date();
    today.setHours(0,0,0,0);
    loans.forEach(loan => {
      if(loan.status === 'closed') return;
      let remainingPrincipal = loan.principalAmount;
      transactions.filter(t=>t.loanId===loan.id).forEach(t=>{ remainingPrincipal -= (t.principalPortion||0); });
      remainingPrincipal = Math.max(0, remainingPrincipal);
      if(remainingPrincipal <= 0) return;
      const startDate = loan.startDate ? new Date(loan.startDate) : new Date();
      if(isNaN(startDate)) return;
      const daysDiff = Math.max(0, Math.floor((today - startDate) / (1000*60*60*24)));
      if(daysDiff <= 0) return;
      const interest = remainingPrincipal * (0.20 / 365) * daysDiff;
      total += interest;
    });
    return total;
  }

  function getNextDueDateForAlert(loan) {
    if (loan.method !== 3 && loan.method !== 4) return null;
    if (loan.status === 'closed') return null;
    const relevantTxns = transactions.filter(t => t.loanId === loan.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
    let lastDate = loan.startDate ? new Date(loan.startDate) : new Date();
    if (relevantTxns.length) lastDate = new Date(relevantTxns[0].date);
    let nextDue = new Date(lastDate);
    if (loan.method === 4) nextDue.setDate(nextDue.getDate() + 7);
    else nextDue.setMonth(nextDue.getMonth() + 1);
    return nextDue;
  }

  // --- CORRECTED addTransaction with proper Flexible (Method 2) logic ---
  function addTransaction(loanId, date, amount, remark) {
    if(currentRole !== "admin") return { success: false, msg: "Viewer cannot add" };
    const loan = getLoan(loanId);
    if(!loan) return { success: false, msg: "Loan not found" };
    if(loan.status === 'closed') return { success: false, msg: "Loan already closed" };
    if(amount <= 0) return { success: false, msg: "Amount must be positive" };
    
    let interestPortion = 0, principalPortion = 0;
    
    // 1. നിലവിലെ ഔട്ട്സ്റ്റാൻഡിങ് മുതൽ (Principal) കണ്ടെത്തുക
    let outstandingPrincipal = loan.principalAmount;
    transactions.filter(t => t.loanId == loan.id).forEach(t => { 
      outstandingPrincipal -= (t.principalPortion || 0); 
    });
    outstandingPrincipal = Math.max(0, outstandingPrincipal);

    // 2. Flexible Method (Method 2) കണക്കുകൂട്ടൽ
    if (loan.method === 2) {
      // അവസാന ഇടപാട് നടന്ന തീയതി നോക്കുക, ഇല്ലെങ്കിൽ ലോൺ തുടങ്ങിയ തീയതി എടുക്കുക
      const loanTxns = transactions.filter(t => t.loanId === loan.id).sort((a,b) => new Date(b.date) - new Date(a.date));
      let lastDate = loan.startDate ? new Date(loan.startDate) : new Date();
      if (loanTxns.length > 0) {
        lastDate = new Date(loanTxns[0].date);
      }
      
      let currentDate = new Date(date);
      if (isNaN(currentDate)) currentDate = new Date();
      
      // ദിവസങ്ങൾ കണക്കാക്കുക
      const diffTime = currentDate - lastDate;
      const diffDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
      
      // പലിശ കണക്കാക്കുക (Monthly Rate അടിസ്ഥാനത്തിൽ)
      const monthlyRate = loan.interestRate / 100;
      const dailyRate = monthlyRate / 30; // മാസത്തെ 30 ദിവസമായി കണക്കാക്കുന്നു
      let interestAccrued = outstandingPrincipal * dailyRate * diffDays;
      interestAccrued = parseFloat(interestAccrued.toFixed(2));
      
      if (amount <= interestAccrued) {
        // അടച്ച തുക പലിശ തീർക്കാൻ പോലും തികയില്ലെങ്കിൽ മുഴുവനും പലിശയിലേക്ക്
        interestPortion = amount;
        principalPortion = 0;
      } else {
        // ആദ്യം പലിശ കുറയ്ക്കുന്നു, ബാക്കി മുതലിലേക്ക്
        interestPortion = interestAccrued;
        principalPortion = amount - interestAccrued;
        
        // മുതൽ ബാക്കിയുള്ള ഔട്ട്സ്റ്റാൻഡിംഗിനേക്കാൾ കൂടാൻ പാടില്ല
        if (principalPortion > outstandingPrincipal) {
          principalPortion = outstandingPrincipal;
        }
      }
    } 
    // മറ്റ് മെത്തേഡുകൾ (1, 3, 4) പഴയതുപോലെ തന്നെ തുടരാം...
    else if (loan.method === 1) { // Interest Only
      interestPortion = amount;
      principalPortion = 0;
    }
    else if (loan.method === 3) { // Monthly EMI
      const monthlyRate = loan.interestRate / 100;
      let interestDue = outstandingPrincipal * monthlyRate;
      interestDue = parseFloat(interestDue.toFixed(2));
      interestPortion = Math.min(amount, interestDue);
      principalPortion = amount - interestPortion;
      if (principalPortion > outstandingPrincipal) principalPortion = outstandingPrincipal;
    }
    else if (loan.method === 4) { // Weekly EMI
      if (amount <= outstandingPrincipal) {
        principalPortion = amount; interestPortion = 0;
      } else {
        principalPortion = outstandingPrincipal; interestPortion = amount - outstandingPrincipal;
      }
    }

    // 3. സേവ് ചെയ്യുക
    const newTxn = { 
      id: Date.now() + Math.random(), 
      loanId: loan.id, 
      date, 
      amount, 
      interestPortion, 
      principalPortion, 
      remark: remark || "", 
      timestamp: new Date().toISOString() 
    };
    transactions.push(newTxn);
    cashCapital += amount;
    
    // 4. ലോൺ സ്റ്റാറ്റസ് അപ്ഡേറ്റ് ചെയ്യുക
    const totalPaidPrincipal = transactions.filter(t => t.loanId == loan.id).reduce((sum, t) => sum + (t.principalPortion || 0), 0);
    if (totalPaidPrincipal >= loan.principalAmount - 0.01) { // ചെറിയ round-off പിശകുകൾ ഒഴിവാക്കാൻ
      loan.status = 'closed';
    } else {
      loan.status = 'active';
    }
    
    saveAll();
    return { success: true, msg: "Payment added successfully!", txn: newTxn };
  }

  function createLoan(custId, amount, rate, method, startDate, tenure, weeklyAmount) {
    if(currentRole !== "admin") return false;
    if(amount > cashCapital) return false;
    let emi = null, weeklyAmt = null;
    if(method === 3) {
      const r = rate/100;
      emi = amount * r * Math.pow(1+r, tenure) / (Math.pow(1+r, tenure)-1);
      emi = Math.round(emi);
    } else if(method === 4) { weeklyAmt = weeklyAmount; if(!weeklyAmt || weeklyAmt <=0) return false; }
    const newLoan = { id: Date.now(), customerId: custId, principalAmount: amount, interestRate: rate, method, status: 'active', startDate, emiAmount: emi, tenure: tenure || null, weeklyAmount: weeklyAmt };
    loans.push(newLoan);
    cashCapital -= amount;
    saveAll();
    return true;
  }

  function showCountdownConfirm(message, onConfirm) {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal countdown-modal';
    let countdown = 5;
    modalDiv.innerHTML = `<div class="modal-content">
      <h3>⚠️ ${message}</h3>
      <p>Confirm deletion after <span id="countdownNum">5</span> seconds</p>
      <div class="countdown-timer" id="timerDisplay">5</div>
      <div class="flex-btns"><button id="confirmDeleteBtn" disabled style="background:#aaa;">Wait ${countdown}s</button><button id="cancelDeleteBtn">Cancel</button></div>
    </div>`;
    document.body.appendChild(modalDiv);
    const timerDisplay = modalDiv.querySelector('#timerDisplay');
    const confirmBtn = modalDiv.querySelector('#confirmDeleteBtn');
    const interval = setInterval(() => {
      countdown--;
      timerDisplay.innerText = countdown;
      confirmBtn.innerText = `Confirm (${countdown}s)`;
      if(countdown <= 0) {
        clearInterval(interval);
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Yes, Delete";
        confirmBtn.style.background = "#dc3545";
      }
    }, 1000);
    confirmBtn.onclick = () => { clearInterval(interval); onConfirm(); modalDiv.remove(); };
    modalDiv.querySelector('#cancelDeleteBtn').onclick = () => { clearInterval(interval); modalDiv.remove(); };
  }

  function deleteTransaction(txnId) {
    if(currentRole !== "admin") return false;
    const txn = transactions.find(t=>t.id==txnId);
    if(!txn) return false;
    showCountdownConfirm("Delete this transaction permanently?", () => {
      const idx = transactions.findIndex(t=>t.id==txnId);
      if(idx !== -1) {
        cashCapital -= transactions[idx].amount;
        transactions.splice(idx,1);
        loans.forEach(l=>{
          const totalPaidPrincipal = transactions.filter(t=>t.loanId==l.id).reduce((sum,t)=>sum+(t.principalPortion||0),0);
          if(totalPaidPrincipal >= l.principalAmount) l.status='closed';
          else l.status='active';
        });
        saveAll();
        renderAll();
      }
    });
    return true;
  }
  
  function editTransaction(txnId, newAmount, newDate, newRemark) {
    if(currentRole !== "admin") return false;
    const txn = transactions.find(t=>t.id==txnId);
    if(!txn) return false;
    cashCapital -= txn.amount;
    const idx = transactions.findIndex(t=>t.id==txnId);
    transactions.splice(idx,1);
    const result = addTransaction(txn.loanId, newDate, newAmount, newRemark);
    if(!result.success) { cashCapital += txn.amount; transactions.push(txn); saveAll(); return false; }
    saveAll(); return true;
  }
  
  function closeLoanWithAmount(loanId, closeAmount, closeDate) {
    const loan = getLoan(loanId);
    if(!loan) return false;
    const remaining = recomputePrincipal(loan);
    if(Math.abs(closeAmount - remaining) > 0.01) return false;
    const res = addTransaction(loanId, closeDate, closeAmount, "Loan closure payment");
    if(res.success) { loan.status = 'closed'; saveAll(); return true; }
    return false;
  }

  function renderCustomers() {
    const container = document.getElementById('customerList');
    if(!container) return;
    container.innerHTML = customers.length ? customers.map(c=>`<div class="list-item"><div class="flex-row"><strong>${escapeHtml(c.name)}</strong><span class="badge">${c.phone||''}</span></div><div class="text-muted">${escapeHtml(c.address||'')}</div></div>`).join('') : '<div class="text-muted">No customers</div>';
    const loanCust = document.getElementById('loanCustomerId');
    if(loanCust && currentRole==="admin") loanCust.innerHTML = '<option value="">-- select --</option>'+customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  }
  
  function renderLoans() {
    const container = document.getElementById('loanList');
    if(!container) return;
    if(loans.length===0) { container.innerHTML='<div class="text-muted">No loans</div>'; return; }
    // Sort: active first, then closed
    const sortedLoans = [...loans].sort((a,b) => {
      if(a.status === 'closed' && b.status !== 'closed') return 1;
      if(a.status !== 'closed' && b.status === 'closed') return -1;
      return 0;
    });
    container.innerHTML = sortedLoans.map(loan => {
      const cust = getCustomer(loan.customerId);
      const out = recomputePrincipal(loan);
      let methodDesc = '';
      if(loan.method===1) methodDesc='Interest only';
      else if(loan.method===2) methodDesc='Flexible';
      else if(loan.method===3) methodDesc=`Monthly EMI ₹${loan.emiAmount}`;
      else methodDesc=`Weekly EMI ₹${loan.weeklyAmount} × ${loan.tenure} weeks`;
      const closedBadge = loan.status === 'closed' ? ' | ✅ CLOSED' : '';
      return `<div class="list-item" data-loan-id="${loan.id}">
        <div class="flex-row"><strong>${cust?cust.name:'Unknown'}</strong><span class="badge">Amount: ₹${loan.principalAmount}</span></div>
        <div>Rate: ${loan.interestRate}% | Start: ${formatDateDMY(loan.startDate)} | ${methodDesc}</div>
        <div>Remaining: ₹${out.toFixed(2)} | Status: ${loan.status==='closed'?'Closed':'Active'}${closedBadge}</div>
        <div><button class="small-btn close-loan" data-id="${loan.id}">🔒 Close Loan</button></div>
      </div>`;
    }).join('');
    document.querySelectorAll('.close-loan').forEach(btn=>{ btn.addEventListener('click', (e)=>{ const id = parseInt(btn.getAttribute('data-id')); showCloseLoanModal(id); }); });
    const txnLoan = document.getElementById('txnLoanId');
    if(txnLoan && currentRole==="admin") txnLoan.innerHTML = '<option value="">-- select loan --</option>'+loans.map(l=>`<option value="${l.id}">${getCustomer(l.customerId)?.name||'N/A'} - Amount: ₹${l.principalAmount}</option>`).join('');
  }
  
  function showCloseLoanModal(loanId) {
    const loan = getLoan(loanId);
    if(!loan) return;
    const remaining = recomputePrincipal(loan);
    if(remaining <= 0.01) { loan.status = 'closed'; saveAll(); renderAll(); alert("Loan already closed"); return; }
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal';
    modalDiv.innerHTML = `<div class="modal-content"><h3>Close Loan</h3><p>Remaining: ₹${remaining.toFixed(2)}</p><label>Closing Amount (₹)</label><input type="number" id="closeAmount"><label>Date</label><input type="date" id="closeDate" value="${new Date().toISOString().slice(0,10)}"><div class="flex-btns"><button id="closeConfirmBtn">Confirm</button><button id="closeCancelBtn">Cancel</button></div></div>`;
    document.body.appendChild(modalDiv);
    modalDiv.querySelector('#closeConfirmBtn').onclick = ()=>{
      const closeAmount = parseFloat(modalDiv.querySelector('#closeAmount').value);
      const closeDate = modalDiv.querySelector('#closeDate').value;
      if(isNaN(closeAmount) || Math.abs(closeAmount-remaining)>0.01) alert(`Amount must equal ₹${remaining.toFixed(2)}`);
      else if(closeLoanWithAmount(loanId, closeAmount, closeDate)) { renderAll(); alert("Loan closed"); modalDiv.remove(); }
      else alert("Failed");
    };
    modalDiv.querySelector('#closeCancelBtn').onclick = ()=> modalDiv.remove();
  }
  
  function renderTransactions() {
    const container = document.getElementById('transactionList');
    if(!container) return;
    if(transactions.length===0) { container.innerHTML='<div class="text-muted">No transactions</div>'; return; }
    container.innerHTML = transactions.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(txn=>{
      const loan = getLoan(txn.loanId);
      const cust = loan ? getCustomer(loan.customerId) : null;
      let actionBtns = '';
      if(currentRole==="admin") actionBtns = `<div><button class="small-btn edit-txn" data-id="${txn.id}">Edit</button><button class="small-btn delete-txn" data-id="${txn.id}">Delete</button></div>`;
      return `<div class="list-item"><div class="flex-row"><strong>${cust?cust.name:'Unknown'}</strong><span class="badge">${formatDateDMY(txn.date)}</span></div><div>Amount: ₹${txn.amount} | Interest: ₹${txn.interestPortion} | Principal: ₹${txn.principalPortion}</div><div>Remark: ${escapeHtml(txn.remark||'')}</div>${actionBtns}</div>`;
    }).join('');
    if(currentRole==="admin") {
      document.querySelectorAll('.edit-txn').forEach(btn=>{ btn.addEventListener('click',()=>{ const id = parseInt(btn.getAttribute('data-id')); const txn = transactions.find(t=>t.id===id); if(txn){ const newAmt = prompt("New amount", txn.amount); if(newAmt!==null){ const newDate = prompt("New date (YYYY-MM-DD)", txn.date); const newRemark = prompt("Remark", txn.remark||''); if(editTransaction(id, parseFloat(newAmt), newDate, newRemark)) renderAll(); else alert("Edit failed"); } } }); });
      document.querySelectorAll('.delete-txn').forEach(btn=>{ btn.addEventListener('click',()=>{ const id = parseInt(btn.getAttribute('data-id')); deleteTransaction(id); renderAll(); }); });
    }
  }
  
  function renderDashboard() {
    document.getElementById('dashCustomers').innerText = customers.length;
    document.getElementById('dashActiveLoans').innerText = loans.filter(l=>l.status!=='closed').length;
    const outstanding = totalOutstanding();
    const invested = totalDisbursed();
    const approxProfit = computeApproxProfit();
    const profitEarned = totalInterest();
    const profitPercent = invested > 0 ? (profitEarned / invested * 100).toFixed(2) : '0.00';
    const approxPercent = invested > 0 ? (approxProfit / invested * 100).toFixed(2) : '0.00';
    const dashboardHtml = `
      <p><strong>💰 Cash on Hand:</strong> <span>₹${cashCapital.toFixed(2)}</span></p>
      <p><strong>📊 Total Outstanding:</strong> <span>₹${outstanding.toFixed(2)}</span></p>
      <p><strong>🏦 Total Invested (Disbursed):</strong> <span>₹${invested.toFixed(2)}</span></p>
      <p><strong>📈 Approx Profit:</strong> <span class="profit-green">₹${approxProfit.toFixed(2)} <span style="font-size:0.75rem;">(+${approxPercent}%)</span></span></p>
      <p><strong>✅ Total Profit Earned:</strong> <span class="profit-green">₹${profitEarned.toFixed(2)} <span style="font-size:0.75rem;">(+${profitPercent}%)</span></span></p>
      <p><strong>👥 Partner's Share (50%):</strong> <span>₹${(profitEarned/2).toFixed(2)}</span></p>
    `;
    document.getElementById('dashboardOutput').innerHTML = dashboardHtml;
    
    const today = new Date(); today.setHours(0,0,0,0);
    const alerts = [];
    loans.forEach(loan => {
      if (loan.status === 'closed') return;
      if (loan.method !== 3 && loan.method !== 4) return;
      const remaining = recomputePrincipal(loan);
      if (remaining <= 0.01) return;
      const nextDue = getNextDueDateForAlert(loan);
      if (!nextDue) return;
      const diffDays = Math.floor((nextDue - today) / (1000*60*60*24));
      if (diffDays >= -3 && diffDays <= 3) {
        const isOverdue = nextDue < today;
        alerts.push({
          customer: getCustomer(loan.customerId)?.name || "Unknown",
          dueDate: nextDue,
          dueDateStr: formatDateDMY(nextDue.toISOString().slice(0,10)),
          isOverdue,
          methodText: loan.method===4 ? `Weekly ₹${loan.weeklyAmount}` : `EMI ₹${loan.emiAmount}`
        });
      }
    });
    alerts.sort((a,b) => {
      if (a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
      return a.dueDate - b.dueDate;
    });
    const container = document.getElementById('dueAlertsContainer');
    if (container) {
      container.innerHTML = alerts.length ? alerts.map(a => `<div class="due-card ${a.isOverdue ? 'overdue' : ''}"><span class="due-customer-name">${a.customer}</span> | Due: ${a.dueDateStr} | ${a.methodText} ${a.isOverdue ? '⚠️ OVERDUE' : ''}</div>`).join('') : '<div class="text-muted">No dues in ±3 days</div>';
    }
  }
  
  function renderCapitalTab() {
    const initCap = cashCapital - totalInterest();
    const capitalHtml = `
      <p><strong>💰 Current Cash:</strong> <span>₹${cashCapital.toFixed(2)}</span></p>
      <p><strong>📈 Total Interest Earned:</strong> <span>₹${totalInterest().toFixed(2)}</span></p>
      <p><strong>🏦 Initial Capital (Estimate):</strong> <span>₹${initCap>=0?initCap.toFixed(2):"0.00"}</span></p>
      <p><strong>📦 Total Disbursed (Principal):</strong> <span>₹${totalDisbursed().toFixed(2)}</span></p>
      <p><strong>📊 Total Outstanding:</strong> <span>₹${totalOutstanding().toFixed(2)}</span></p>
      <p><strong>✅ Principal Recovered:</strong> <span>₹${totalPrincipalRecovered().toFixed(2)}</span></p>
    `;
    document.getElementById('capitalOutput').innerHTML = capitalHtml;
    const historyDiv = document.getElementById('capitalHistoryList');
    if(historyDiv) {
      historyDiv.innerHTML = capitalHistory.length ? capitalHistory.map(h => `<div class="capital-entry"><span>${formatDateDMY(h.date)} | ${h.type === 'add' ? '➕ Invest' : '🏧 Withdraw'} ₹${h.amount}</span><span class="badge">${new Date(h.timestamp).toLocaleString()}</span></div>`).join('') : '<div class="text-muted">No capital transactions yet</div>';
    }
  }
  
  function renderAll() { 
    renderCustomers(); renderLoans(); renderTransactions(); renderDashboard(); renderCapitalTab();
    if(currentRole==="viewer") {
      document.querySelectorAll('#mainApp input, #mainApp select, #mainApp textarea, #mainApp button').forEach(el=>{ if(!el.classList.contains('tab') && el.id !== 'transactionManagerBtn' && el.id !== 'moreDetailsBtn') el.disabled = true; });
    } else {
      document.querySelectorAll('#mainApp input, #mainApp select, #mainApp textarea, #mainApp button').forEach(el=>el.disabled=false);
    }
  }
  function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

  function initEvents() {
    document.getElementById('transactionManagerBtn')?.addEventListener('click', () => { window.location.href = `transations.html?role=${currentRole}`; });
    document.getElementById('moreDetailsBtn')?.addEventListener('click', () => { window.location.href = 'details.html'; });
    document.getElementById('addCustomerBtn')?.addEventListener('click',()=>{ if(currentRole!=="admin") return; const name = document.getElementById('custName').value.trim(); if(!name) return alert("Name required"); customers.push({ id: Date.now(), name, phone: document.getElementById('custPhone').value.trim(), address: document.getElementById('custAddress').value.trim().slice(0,150) }); saveAll(); renderAll(); document.getElementById('custName').value=''; document.getElementById('custPhone').value=''; document.getElementById('custAddress').value=''; });
    document.getElementById('createLoanBtn')?.addEventListener('click',()=>{ if(currentRole!=="admin") return; const custId = parseInt(document.getElementById('loanCustomerId').value); if(!custId) return alert("Select customer"); const startDate = document.getElementById('loanStartDate').value; if(!startDate) return alert("Start date"); const amount = parseFloat(document.getElementById('loanAmount').value); const rate = parseFloat(document.getElementById('loanInterest').value); const method = parseInt(document.getElementById('loanMethod').value); if(isNaN(amount)||amount<=0) return alert("Valid amount"); if(method!==4 && (isNaN(rate)||rate<0)) return alert("Rate required"); if(amount > cashCapital) return alert(`Insufficient cash. Available: ₹${cashCapital}`); let tenure=null, weeklyAmt=null; if(method===3||method===4){ tenure=parseInt(document.getElementById('loanTenure').value); if(!tenure) return alert(`Enter ${method===3?'months':'weeks'}`); if(method===4){ weeklyAmt=parseFloat(document.getElementById('weeklyInstallment').value); if(!weeklyAmt) return alert("Weekly amount"); } } if(createLoan(custId, amount, rate, method, startDate, tenure, weeklyAmt)) renderAll(); else alert("Creation failed"); });
    document.getElementById('addTransactionBtn')?.addEventListener('click',()=>{ if(currentRole!=="admin") return; const loanId = parseInt(document.getElementById('txnLoanId').value); if(!loanId) return alert("Select loan"); const date = document.getElementById('txnDate').value || new Date().toISOString().slice(0,10); const amount = parseFloat(document.getElementById('txnAmount').value); if(isNaN(amount)||amount<=0) return alert("Valid amount"); const res = addTransaction(loanId, date, amount, document.getElementById('txnRemark').value); if(res.success) renderAll(); else alert(res.msg); });
    document.getElementById('addCapitalBtn')?.addEventListener('click',()=>{ if(currentRole!=="admin") return; const addAmt = parseFloat(document.getElementById('addCapitalInput').value); if(isNaN(addAmt) || addAmt<=0) return alert("Valid amount"); cashCapital += addAmt; addCapitalHistory('add', addAmt, new Date().toISOString().slice(0,10)); saveAll(); renderAll(); document.getElementById('addCapitalInput').value=''; alert(`Added ₹${addAmt}`); });
    document.getElementById('withdrawCapitalSettingsBtn')?.addEventListener('click',()=>{ if(currentRole!=="admin") return; const amt = parseFloat(document.getElementById('withdrawAmountSettings').value); if(isNaN(amt)||amt<=0) return alert("Valid amount"); if(amt > cashCapital) return alert("Insufficient capital"); cashCapital -= amt; addCapitalHistory('withdraw', amt, new Date().toISOString().slice(0,10)); saveAll(); renderAll(); document.getElementById('withdrawAmountSettings').value=''; alert(`Withdrew ₹${amt}`); });
    document.getElementById('loanMethod')?.addEventListener('change',(e)=>{ const method = parseInt(e.target.value); const emiDiv = document.getElementById('emiFields'); const weeklyField = document.getElementById('weeklyAmountField'); const tenureLabel = document.getElementById('tenureLabel'); if(method===3){ emiDiv.style.display='block'; weeklyField.style.display='none'; tenureLabel.innerText='Tenure (months)'; } else if(method===4){ emiDiv.style.display='block'; weeklyField.style.display='block'; tenureLabel.innerText='Number of weeks'; } else emiDiv.style.display='none'; });
    document.querySelectorAll('.tab').forEach(tab=>{ tab.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.getElementById(tab.getAttribute('data-tab')).classList.add('active'); }); });
  }

  async function unlockApp() {
    const pwd = document.getElementById('passwordInput').value;
    if(pwd==='9947') { currentRole="admin"; await proceed(); }
    else if(pwd==='4250') { currentRole="viewer"; await proceed(); }
    else if(pwd==='0000') { document.getElementById('passwordModal').style.display='none'; document.getElementById('fakeTimeDisplay').style.display='block'; document.getElementById('fakeTimeDisplay').innerHTML = `<div style="background:white;padding:30px;border-radius:20px;width:80%;margin:auto;"><h2>System Time</h2><p>${new Date().toLocaleString()}</p><button onclick="location.reload()">Back</button></div>`; }
    else document.getElementById('pwdError').innerText='Wrong password';
  }
  async function proceed() {
    document.getElementById('passwordModal').style.display='none';
    document.getElementById('mainApp').style.display='block';
    await loadData();
    initEvents();
    renderAll();
    document.getElementById('emiFields').style.display='none';
    document.getElementById('loanStartDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('txnDate').value = new Date().toISOString().slice(0,10);
  }
  document.getElementById('unlockBtn')?.addEventListener('click',unlockApp);
  document.getElementById('passwordInput')?.addEventListener('keypress',e=>{if(e.key==='Enter') unlockApp();});
</script>
</body>
