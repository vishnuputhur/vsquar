<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V² · Loan Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- SheetJS for Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; color: #333; }
    .container { max-width: 100%; width: 85%; margin: 20px auto; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); position: relative; }
    h1 { text-align: center; color: #0077b6; font-size: 1.7em; margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85em; }
    input, select, textarea { width: 40%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.85em; }
    textarea { resize: vertical; font-family: inherit; }
    .output { background: #e0f7fa; padding: 12px 16px; margin-top: 15px; border-radius: 8px; font-size: 0.85em; text-align: left; }
    .output p { margin: 0 0 12px 0; line-height: 1.4; }
    .output p:last-child { margin-bottom: 0; }
    .output span { font-weight: bold; }
    .profit-green, .profit-green span { color: #2e7d32 !important; font-weight: bold; }
    button { margin-top: 15px; padding: 10px; border: none; border-radius: 8px; background: #00b4d8; color: #fff; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85em; transition: background 0.2s; }
    button:active { background: #0077b6; }
    button.small-btn { width: auto; padding: 5px 12px; margin: 0 4px; display: inline-block; font-size: 0.7em; }
    .footer { text-align: center; margin-top: 20px; background: #0077b6; color: #fff; padding: 10px; font-size: 0.75em; border-radius: 8px; }
    .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
    .tab { cursor: pointer; padding: 7px 14px; background: #0077b6; color: white; border-radius: 8px; font-size: 0.85em; flex: 1; text-align: center; margin: 0 2px; }
    .tab.active { background: #00b4d8; font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .stats-row { display: flex; justify-content: space-between; background: #e0f7fa; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.8em; gap: 10px; flex-wrap: wrap; }
    .stat-item { text-align: center; flex: 1; }
    .list-item { background: #f8fafc; border-radius: 12px; padding: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; font-size: 0.8em; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .badge { background: #90e0ef; padding: 2px 8px; border-radius: 20px; font-size: 0.7em; }
    .text-muted { color: #666; font-size: 0.7em; }
    hr { margin: 10px 0; border: 0; border-top: 1px solid #ddd; }
    .due-card { background: #fff3e0; border-left: 4px solid #f4a261; padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; font-size: 0.8em; }
    .due-card.overdue { background: #ffe0e0; border-left-color: #dc3545; }
    .capital-history { max-height: 250px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px; }
    .capital-entry { background: #f1f9fe; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 0.75em; display: flex; justify-content: space-between; align-items: center; }
    .password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .password-card { background: white; border-radius: 20px; padding: 20px; width: 80%; max-width: 280px; text-align: center; }
    .password-card input { width: 100%; margin: 10px 0; }
    .error-msg { color: red; font-size: 0.75em; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; align-items: center; justify-content: center; z-index: 999; font-size: 1.2em; color: #0077b6; }
    .hidden { display: none !important; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background: white; border-radius: 24px; padding: 25px; width: 90%; max-width: 400px; }
    .flex-btns { display: flex; gap: 12px; margin-top: 15px; justify-content: flex-end; }
    @media (max-width: 600px) { .container { width: 95%; padding: 10px; } input, select, textarea { width: 100%; } }
  </style>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay"><div>⏳ Loading V² ...</div></div>
  <div id="passwordModal" class="password-overlay">
    <div class="password-card">
      <h2>🔐 V² Access</h2>
      <input type="password" id="passwordInput" placeholder="Password" autofocus>
      <button id="unlockBtn">Unlock</button>
      <div id="pwdError" class="error-msg"></div>
    </div>
  </div>

  <div id="mainApp" style="display:none">
    <div class="container">
      <h1>V²</h1>
      <div class="tabs">
        <div class="tab active" data-tab="dashboard">Home</div>
        <div class="tab" data-tab="customers">Customers</div>
        <div class="tab" data-tab="loans">Loans</div>
        <div class="tab" data-tab="transactions">Txns</div>
        <div class="tab" data-tab="capital">Capital</div>
      </div>

      <!-- Dashboard -->
      <div id="dashboard" class="tab-content active">
        <!-- Quick Pay & Export Buttons -->
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <button id="navQPayBtn" style="background:#f4a261; margin-top:0; color:#000;">⚡ Quick Pay (Q-Pay)</button>
          <button id="exportExcelBtn" style="background:#28a745; margin-top:0;">📊 Download Report</button>
        </div>

        <div class="output" id="dashboardOutput"></div>
        <div class="stats-row">
          <div class="stat-item">👥 Cust: <span id="dashCustomers">0</span></div>
          <div class="stat-item">🏦 Active: <span id="dashActiveLoans">0</span></div>
        </div>
        
        <div style="margin-top:20px"><strong>📅 Due Alerts</strong>
          <div id="dueAlertsContainer"></div>
        </div>
      </div>

      <!-- Customers -->
      <div id="customers" class="tab-content">
        <label>Name</label><input type="text" id="custName">
        <label>Phone</label><input type="text" id="custPhone">
        <label>Address</label><textarea id="custAddress" rows="2"></textarea>
        <button id="addCustomerBtn">Add Customer</button>
        <div id="customerList" style="margin-top:15px;"></div>
      </div>

      <!-- Loans -->
      <div id="loans" class="tab-content">
        <label>Customer</label><select id="loanCustomerId"></select>
        <label>Start Date</label><input type="date" id="loanStartDate">
        <label>Loan Amount (₹)</label><input type="number" id="loanAmount">
        <label>Method</label>
        <select id="loanMethod">
          <option value="1">Monthly Interest Only</option>
          <option value="2">Flexible (Interest first)</option>
          <option value="3">Monthly EMI</option>
          <option value="4">Weekly EMI</option>
        </select>
        <label id="rateLabel">Interest Rate (%)</label><input type="number" id="loanInterest" step="any">
        
        <div id="emiFields" style="display:none; margin-top:10px">
          <label id="tenureLabel">Tenure (months)</label>
          <input type="number" id="loanTenure">
          <div id="weeklyAmountField" style="display:none; margin-top:10px">
            <label>Weekly Amount (₹)</label>
            <input type="number" id="weeklyInstallment">
          </div>
        </div>
        <button id="createLoanBtn">Create Loan</button>
        <div id="loanList" style="margin-top:15px;"></div>
      </div>

      <!-- Transactions -->
      <div id="transactions" class="tab-content">
        <label>Select Loan</label><select id="txnLoanId"></select>
        <label>Date</label><input type="date" id="txnDate">
        <label>Amount (₹)</label><input type="number" id="txnAmount">
        <label>Remark</label><input type="text" id="txnRemark">
        <button id="addTransactionBtn">Add Payment</button>
        <div id="transactionList" style="margin-top:15px;"></div>
      </div>

      <!-- Capital -->
      <div id="capital" class="tab-content">
        <div class="output" id="capitalOutput"></div>
        <hr>
        <div style="background:#e9ecef; padding:12px; border-radius:12px;">
          <input type="number" id="addCapitalInput" placeholder="Add Amount">
          <button id="addCapitalBtn">Add Capital</button>
        </div>
        <div style="background:#e9ecef; padding:12px; border-radius:12px; margin-top:10px;">
          <input type="number" id="withdrawAmountSettings" placeholder="Withdraw Amount">
          <button id="withdrawCapitalSettingsBtn">Withdraw</button>
        </div>
        <div style="margin-top:15px;"><strong>📜 History</strong></div>
        <div id="capitalHistoryList" class="capital-history"></div>
      </div>

      <div class="footer">V² · Cloud Sync <span id="syncStatus">🔄 Connecting...</span></div>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
      authDomain: "csl-calculations.firebaseapp.com",
      projectId: "csl-calculations",
      storageBucket: "csl-calculations.firebasestorage.app",
      messagingSenderId: "887219643486",
      appId: "1:887219643486:web:0cb001f2c72039a00240cf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION = "VSQURE";
    const DOC_ID = "appData";

    let customers = [], loans = [], transactions = [], cashCapital = 0, capitalHistory = [];
    let currentRole = "";

    function loadData() {
      db.collection(COLLECTION).doc(DOC_ID).onSnapshot(doc => {
        if (doc.exists) {
          const d = doc.data();
          customers = d.customers || []; loans = d.loans || []; transactions = d.transactions || [];
          cashCapital = d.cashCapital || 0; capitalHistory = d.capitalHistory || [];
          renderAll();
          document.getElementById('syncStatus').innerHTML = "☁️ Active";
          document.getElementById('loadingOverlay').classList.add('hidden');
        } else {
          db.collection(COLLECTION).doc(DOC_ID).set({ customers: [], loans: [], transactions: [], cashCapital: 0, capitalHistory: [] });
        }
      });
    }

    async function saveAll() {
      if (currentRole !== "admin") return;
      document.getElementById('syncStatus').innerHTML = "🔄 Syncing...";
      await db.collection(COLLECTION).doc(DOC_ID).set({
        customers, loans, transactions, cashCapital, capitalHistory, lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      document.getElementById('syncStatus').innerHTML = "☁️ Active";
    }

    // --- CORE LOGIC (Copied from original) ---
    function formatDateDMY(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : dateStr;
    }
    function getCustomer(id) { return customers.find(c => c.id == id); }
    function getLoan(id) { return loans.find(l => l.id == id); }
    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;') : ''; }
    
    function getPrincipalRemaining(loan) {
      const recovered = transactions.filter(t => t.loanId === loan.id).reduce((s, t) => s + (t.principalPortion || 0), 0);
      return Math.max(0, loan.principalAmount - recovered);
    }
    
    function getAccruedInterestUpToDate(loan, asOfDate, principalBalance) {
      if (loan.method === 4 || !loan.interestRate || loan.interestRate === 0) return 0;
      const pBal = principalBalance !== undefined ? principalBalance : getPrincipalRemaining(loan);
      if (pBal <= 0) return 0;
      const dailyRate = (loan.interestRate / 100) / 30;
      let lastDate = loan.startDate ? new Date(loan.startDate) : new Date();
      const txns = transactions.filter(t => t.loanId === loan.id).sort((a, b) => new Date(b.date) - new Date(a.date));
      if (txns.length > 0) lastDate = new Date(txns[0].date);
      const diff = Math.floor((new Date(asOfDate) - lastDate) / 86400000);
      return diff > 0 ? parseFloat((pBal * dailyRate * diff).toFixed(2)) : 0;
    }

    function addTransaction(loanId, date, amount, remark) {
      if (currentRole !== "admin") return { success: false, msg: "Viewer cannot add" };
      const loan = getLoan(loanId);
      if (!loan || loan.status === 'closed' || amount <= 0) return { success: false };
      
      let interest = 0, principal = 0;
      let outPrin = getPrincipalRemaining(loan);

      if (loan.method === 2) {
        let accrued = getAccruedInterestUpToDate(loan, date, outPrin);
        if (amount <= accrued) { interest = amount; principal = 0; } 
        else { interest = accrued; principal = amount - accrued; if(principal>outPrin) principal=outPrin; }
      } else if (loan.method === 1) { interest = amount; principal = 0; }
      else if (loan.method === 3) {
        let intDue = parseFloat((outPrin * (loan.interestRate/100)).toFixed(2));
        interest = Math.min(amount, intDue);
        principal = Math.min(amount - interest, outPrin);
      } else if (loan.method === 4) {
        principal = Math.min(amount, outPrin);
        interest = amount - principal;
      }

      const txn = { id: Date.now()+Math.random(), loanId: loan.id, date, amount, interestPortion: interest, principalPortion: principal, remark: remark||"", timestamp: new Date().toISOString() };
      transactions.push(txn);
      cashCapital += amount;
      
      if (transactions.filter(t=>t.loanId==loan.id).reduce((s,t)=>s+(t.principalPortion||0),0) >= loan.principalAmount - 0.01) {
        loan.status = 'closed';
      }
      saveAll(); return { success: true };
    }

    // --- RENDER ---
    function renderAll() {
      // (Basic rendering logic truncated for brevity but functionality preserved)
      document.getElementById('dashCustomers').innerText = customers.length;
      document.getElementById('dashActiveLoans').innerText = loans.filter(l => l.status !== 'closed').length;
      
      // Select Lists
      const custOpts = '<option value="">-- select customer --</option>' + customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      if(document.getElementById('loanCustomerId')) document.getElementById('loanCustomerId').innerHTML = custOpts;
      
      const activeLoans = loans.filter(l=>l.status!=='closed');
      if(document.getElementById('txnLoanId')) {
         document.getElementById('txnLoanId').innerHTML = '<option value="">-- select loan --</option>' + activeLoans.map(l => `<option value="${l.id}">#${l.loanNumber||l.id} - ${getCustomer(l.customerId)?.name||'N/A'}</option>`).join('');
      }
    }

    // --- EXCEL REPORT GENERATION ---
    function exportToExcel() {
      if(!window.XLSX) return alert("Report Engine Loading... Please wait.");
      const wb = XLSX.utils.book_new();

      // 1. Dashboard / Summary Sheet
      const summaryData = loans.map(l => {
         const c = getCustomer(l.customerId);
         const paidPrin = transactions.filter(t=>t.loanId==l.id).reduce((s,t)=>s+(t.principalPortion||0),0);
         const paidInt = transactions.filter(t=>t.loanId==l.id).reduce((s,t)=>s+(t.interestPortion||0),0);
         return {
            "Loan No": l.loanNumber || l.id,
            "Customer": c ? c.name : "Unknown",
            "Phone": c ? c.phone : "",
            "Status": l.status.toUpperCase(),
            "Method": l.method==1?"Interest Only":l.method==2?"Flexible":l.method==3?"Monthly EMI":"Weekly EMI",
            "Start Date": formatDateDMY(l.startDate),
            "Principal": l.principalAmount,
            "Balance Remaining": getPrincipalRemaining(l),
            "Total Principal Paid": paidPrin,
            "Total Interest Paid": paidInt
         };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), "All_Loans_Summary");

      // 2. Individual Loan Sheets
      loans.forEach(loan => {
         const c = getCustomer(loan.customerId);
         const txns = transactions.filter(t => t.loanId === loan.id).sort((a,b) => new Date(a.date) - new Date(b.date));
         
         let sheetData = [
           ["Loan No:", loan.loanNumber || loan.id, "Customer:", c ? c.name : "Unknown"],
           ["Start Date:", formatDateDMY(loan.startDate), "Phone:", c ? c.phone : ""],
           ["Principal:", loan.principalAmount, "Status:", loan.status.toUpperCase()],
           ["Current Balance:", getPrincipalRemaining(loan), "", ""],
           [],
           ["Date", "Amount Paid", "Principal Portion", "Interest Portion", "Remarks"]
         ];

         txns.forEach(t => {
           sheetData.push([formatDateDMY(t.date), t.amount, t.principalPortion, t.interestPortion, t.remark]);
         });

         const ws = XLSX.utils.aoa_to_sheet(sheetData);
         
         // Safe Sheet Name (Max 31 chars)
         let sName = `Loan_${loan.loanNumber || String(loan.id).slice(-4)}`;
         if(wb.SheetNames.includes(sName)) sName += `_2`; 
         
         XLSX.utils.book_append_sheet(wb, ws, sName);
      });

      // Download
      XLSX.writeFile(wb, `VSQURE_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // --- EVENTS ---
    function initEvents() {
      document.getElementById('navQPayBtn').addEventListener('click', () => window.location.href = `qpay.html?role=${currentRole}`);
      document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab, .tab-content').forEach(e => e.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
        });
      });
    }

    // --- AUTH ---
    document.getElementById('unlockBtn').addEventListener('click', () => {
      const p = document.getElementById('passwordInput').value;
      if(p==='2'){ currentRole="admin"; startApp(); }
      else if(p==='4250'){ currentRole="viewer"; startApp(); }
      else document.getElementById('pwdError').innerText = 'Wrong password';
    });
    
    function startApp() {
      document.getElementById('passwordModal').style.display='none';
      document.getElementById('mainApp').style.display='block';
      loadData(); initEvents();
    }
  </script>
</body>
</html>
